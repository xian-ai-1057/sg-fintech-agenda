<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
/* ============================================================
   SFF 2026 Agenda — 資料載入器
   agenda.csv  ──►  window.SFF / window.SFF_DESC

   資料與介面分離：所有場次都住在 agenda.csv（由 scrape_sff_agenda.py 產生），
   下方的 React 介面完全不知道 CSV 的存在，只吃這裡組出來的資料結構。
   要改議程內容，請改 agenda.csv，不要改這個檔案。
   ============================================================ */
(function () {
"use strict";

var CSV_URL  = "agenda.csv";
var OFFICIAL = "https://www.fintechfestival.sg/agenda/";

/* ============================================================
   呈現設定
   ------------------------------------------------------------
   代碼、短標籤、配色屬於「怎麼顯示」，場次資料一律來自 CSV。
   沒列在這裡的場地／主題會自動推導代碼與配色 —— 網站不會壞、
   也不會漏掉任何場次，只是標籤比較陽春。想調整就在這裡補一行。
   ============================================================ */

/* 場地：CSV 裡的名稱 -> [代碼, 欄位短標籤, 完整場地名]
   （列出的順序 = 日曆由左至右的欄位順序）*/
var VENUE_CFG = {
  /* Singapore Expo 主舞台 */
  "Festival Stage":       ["FES", "Festival Stage ‧ Hall 1",  "Festival Stage, Hall 1, Singapore Expo"],
  "Founders Stage":       ["FOU", "Founders Stage ‧ Hall 2",  "Founders Stage, Hall 2, Singapore Expo"],
  "Catalyst Stage":       ["CAT", "Catalyst Stage ‧ Hall 3",  "Catalyst Stage, Hall 3, Singapore Expo"],
  "Impact Stage":         ["IMP", "Impact Stage ‧ Hall 3",    "Impact Stage, Hall 3, Singapore Expo"],
  "FutureMatters Stage":  ["FUT", "FutureMatters ‧ Hall 5",   "FutureMatters Stage, Hall 5, Singapore Expo"],
  "Frontier Stage":       ["FRO", "Frontier Stage ‧ Hall 6",  "Frontier Stage, Hall 6, Singapore Expo"],
  "Ignite Stage":         ["IGN", "Ignite Stage ‧ Hall 5",    "Ignite Stage, Hall 5, Singapore Expo"],
  "Policy Stage":         ["POL", "Policy Stage ‧ Hall 3",    "Policy Stage, Hall 3, Singapore Expo"],
  "India Pavilion":       ["IND", "India Pavilion ‧ Hall 5",  "India Pavilion, Hall 5, Singapore Expo"],
  "Merchant Agenda":      ["MER", "Merchant Agenda ‧ Hall 6", "Merchant Experience Zone, Hall 6, Singapore Expo"],
  /* 2026 起官網的 Exhibition Floor 分散在各館，CSV 的 location 只寫館別，靠 location 拆欄 */
  "Hall 2, Singapore EXPO": ["EX2", "Exhibition Floor ‧ Hall 2", "Exhibition Floor, Hall 2, Singapore Expo"],
  "Hall 3, Singapore EXPO": ["EX3", "Exhibition Floor ‧ Hall 3", "Exhibition Floor, Hall 3, Singapore Expo"],
  "Hall 4, Singapore EXPO": ["EX4", "Exhibition Floor ‧ Hall 4", "Exhibition Floor, Hall 4, Singapore Expo"],
  "Hall 5, Singapore EXPO": ["EX5", "Exhibition Floor ‧ Hall 5", "Exhibition Floor, Hall 5, Singapore Expo"],
  "Hall 6, Singapore EXPO": ["EX6", "Exhibition Floor ‧ Hall 6", "Exhibition Floor, Hall 6, Singapore Expo"],
  /* Lounge / 周邊場地（CSV 的 stage 都是 Side Programmes，靠 location 區分）*/
  "GFTN Lounge (Hall 4)":         ["GFT", "GFTN Lounge ‧ Hall 4",   "GFTN Lounge, Hall 4, Singapore Expo"],
  "Investors Lounge (Hall 2)":    ["INV", "Investors Lounge ‧ Hall 2", "Investors Lounge, Hall 2, Singapore Expo"],
  "Pay It Forward Lounge (Hall 3)": ["PIF", "Pay It Forward ‧ Hall 3", "Pay It Forward Lounge, Hall 3, Singapore Expo"],
  "Synergy Soup (Hall 5)":        ["SYN", "Synergy Soup ‧ Hall 5",  "Synergy Soup, Hall 5, Singapore Expo"],
  /* 2025 Insights Forum（Sands Expo）—— 保留給 archive 資料與未來可能的 Forum 日 */
  "Design Thinking Room": ["DT",  "Design Thinking Room",     "Design Thinking Room"],
  "Workshop Room 1, Sands Expo & Convention Centre, Level 4": ["W1", "Workshop Room 1 ‧ L4", "Workshop Room 1, Sands Expo & Convention Centre, Level 4"],
  "Workshop Room 2, Sands Expo & Convention Centre, Level 4": ["W2", "Workshop Room 2 ‧ L4", "Workshop Room 2, Sands Expo & Convention Centre, Level 4"],
  "Workshop Room 3, Sands Expo & Convention Centre, Level 4": ["W3", "Workshop Room 3 ‧ L4", "Workshop Room 3, Sands Expo & Convention Centre, Level 4"],
  "Launchpad Room":       ["LP",  "Launchpad Room",           "Launchpad Room"],
  "Roundtable Room 1, Sands Expo & Convention Centre, Level 4": ["RT1", "Roundtable Room 1 ‧ L4", "Roundtable Room 1, Sands Expo & Convention Centre, Level 4"],
  "Roundtable Room 2, Sands Expo & Convention Centre, Level 4": ["RT2", "Roundtable Room 2 ‧ L4", "Roundtable Room 2, Sands Expo & Convention Centre, Level 4"],
  "Roundtable Room 3, Sands Expo & Convention Centre, Level 4": ["RT3", "Roundtable Room 3 ‧ L4", "Roundtable Room 3, Sands Expo & Convention Centre, Level 4"],
  "Roundtable Room 4, Sands Expo & Convention Centre, Level 4": ["RT4", "Roundtable Room 4 ‧ L4", "Roundtable Room 4, Sands Expo & Convention Centre, Level 4"],
  "Roundtable Room 5, Sands Expo & Convention Centre, Level 4": ["RT5", "Roundtable Room 5 ‧ L4", "Roundtable Room 5, Sands Expo & Convention Centre, Level 4"],
  "Sands Expo & Convention Centre": ["SE", "Bayview Foyer / 其他", "Sands Expo & Convention Centre"],
  /* 官網還沒公布場地的場次會落到這一欄（見 venueName）*/
  "TBC": ["TBC", "未定 TBC", "場地未公布 Venue to be confirmed"]
};

/* 主題 track：CSV 裡的名稱 -> [代碼, 繁體中文, 色票] */
var TRACK_CFG = {
  /* 2026：官方主題「Rewiring the World」下的五股力量 */
  "Technology Rewiring":          ["TEC", "科技重塑",      "#3d6a9e"],
  "Technological Rewiring":       ["TEC", "科技重塑",      "#3d6a9e"],
  "Policy Rewiring":              ["POL", "政策重塑",      "#a8553f"],
  "Talent Rewiring":              ["TAL", "人才重塑",      "#9b5878"],
  "Geopolitical Rewiring":        ["GEO", "地緣政治重塑",  "#6a619a"],
  "Geoeconomic Rewiring":         ["GEO", "地緣經濟重塑",  "#6a619a"],
  "Capital Rewiring":             ["CAP", "資本重塑",      "#a86f32"],
  /* 2025（保留：封存資料或舊 CSV 丟進來時仍有正確的中文名與配色）*/
  "Blueprint for Digital Assets": ["DA", "數位資產藍圖",  "#2f6fe0"],
  "Next-Gen Transactions":        ["NT", "次世代交易",    "#0e9fb3"],
  "Securing the Future":          ["SF", "未來資安",      "#df4d47"],
  "Bridging the Financial Gap":   ["BG", "普惠金融",      "#c2952a"],
  "Roadmap for AI and Quantum":   ["AQ", "AI 與量子藍圖", "#6a5ae0"],
  "Talent of Tomorrow":           ["TT", "明日人才",      "#db5793"],
  "Sustainability in Action":     ["SU", "永續行動",      "#2fa15a"],
  "Empowering Entrepreneurship":  ["EE", "創業賦能",      "#e2743a"],
  "Others":                       ["OT", "其他",          "#8a8a8e"]
};

/* 沒列在 TRACK_CFG 的 track 依序取用這些顏色 */
var PALETTE = ["#1f8a70", "#a44ac3", "#c9531f", "#3a6ea5", "#b3123f", "#7a6f18", "#0f7b8a", "#8e44ad"];
var GREY = "#8a847a";

/* CSV 的 event_type -> 介面用的存取代碼 */
var ACCESS_MAP = { "open": "O", "invite-only": "I", "invite only": "I", "premium": "P" };

var MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
var WD_EN  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var WD_ZH  = ["日","一","二","三","四","五","六"];

/* ============================================================
   CSV parser（RFC 4180：引號欄位、欄位內換行、"" 跳脫、UTF-8 BOM）
   ============================================================ */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

  var rows = [], row = [], field = "", inQuotes = false, i = 0;
  while (i < text.length) {
    var c = text.charAt(i);
    if (inQuotes) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"')  { inQuotes = true; i++; continue; }
    if (c === ",")  { row.push(field); field = ""; i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* 表頭 + 資料列 -> 物件陣列 */
function toRecords(rows) {
  if (!rows.length) return [];
  var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  var out = [];
  for (var r = 1; r < rows.length; r++) {
    var cells = rows[r];
    if (cells.length === 1 && !cells[0].trim()) continue;   // 空行
    var o = {};
    for (var c = 0; c < head.length; c++) o[head[c]] = (cells[c] || "").trim();
    out.push(o);
  }
  return out;
}

/* ============================================================
   小工具
   ============================================================ */

/* "9:00 AM" / "1:30 PM" / "13:30" -> "9:00" / "13:30"（24 小時制）*/
function to24(s) {
  var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(s).trim());
  if (!m) return null;
  var h = parseInt(m[1], 10), ap = (m[3] || "").toUpperCase();
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h + ":" + m[2];
}

/* "Mon, 10 Nov | 9:00 AM - 10:30 AM" -> ["9:00", "10:30"] */
function parseTimes(datetime) {
  var tail = String(datetime).split("|").pop();
  var m = /(\d{1,2}:\d{2}\s*(?:AM|PM)?)\s*[-–—]\s*(\d{1,2}:\d{2}\s*(?:AM|PM)?)/i.exec(tail);
  if (m) {
    var a = to24(m[1]), b = to24(m[2]);
    if (a && b) return [a, b];
  }
  /* 只有開始時間 -> 預設 30 分鐘 */
  var one = /(\d{1,2}:\d{2}\s*(?:AM|PM)?)/i.exec(tail);
  if (one) {
    var s = to24(one[1]);
    if (s) {
      var p = s.split(":"), t = parseInt(p[0], 10) * 60 + parseInt(p[1], 10) + 30;
      return [s, Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")];
    }
  }
  return null;
}

/* 場次網址 -> 唯一識別（slug），用來當說明文字的 key。
   官網用過兩種網址格式，兩種都要吃得下：
     2026  https://…/agenda?session=AGND441-welcome-…   -> "AGND441-welcome-…"
     2025  https://…/agenda/agn90-trusted-data-…        -> "agn90-trusted-data-…"
   2026 的網址含 %3B、%22 等百分比編碼，所以要解碼後再當 key。 */
function slugOf(url) {
  var raw = String(url || "");
  if (!raw) return "";
  var q = /[?&]session=([^&#]+)/i.exec(raw);
  var slug = q ? q[1] : raw.split(/[?#]/)[0].replace(/\/+$/, "").split("/").pop();
  try { slug = decodeURIComponent(slug); } catch (e) { /* 編碼壞掉就用原字串 */ }
  return slug;
}

/* 由名稱推導代碼："Design Thinking Room" -> "DTR"、"Garnet 212" -> "G2" */
function initials(name) {
  var words = String(name).replace(/[^A-Za-z0-9一-鿿]+/g, " ").split(/\s+/).filter(Boolean);
  var code = words.slice(0, 3).map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
  return (code || "X").slice(0, 4);
}

function uniqueCode(base, used) {
  var code = base, n = 2;
  while (used[code]) code = base + (n++);
  used[code] = true;
  return code;
}

/* 由 ISO 日期或 "Mon, 10 Nov" 取出顯示用的日期資訊 */
function dayInfo(key, isoHint) {
  var iso = /^\d{4}-\d{2}-\d{2}$/.test(key) ? key : (isoHint || "");
  if (iso) {
    var p = iso.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return {
      iso:  iso,
      wd:   WD_EN[dt.getDay()],
      wdz:  WD_ZH[dt.getDay()],
      date: MON[+p[1] - 1] + " " + (+p[2]),
      md:   (+p[1]) + "/" + (+p[2])
    };
  }
  /* 沒有 ISO 欄位時，退回解析 "Mon, 10 Nov" */
  var m = /^\s*([A-Za-z]{3})[a-z]*,?\s*(\d{1,2})\s+([A-Za-z]{3})/.exec(key);
  if (m) {
    var mon = MONTHS[m[3].toLowerCase()] || 0;
    return {
      iso: "", wd: m[1],
      wdz: WD_ZH[WD_EN.indexOf(m[1])] || "",
      date: m[3] + " " + parseInt(m[2], 10),
      md: mon ? mon + "/" + parseInt(m[2], 10) : key
    };
  }
  return { iso: "", wd: "", wdz: "", date: key, md: key };
}

/* ============================================================
   CSV 記錄 -> window.SFF
   ============================================================ */
function build(records) {

  /* ---- 1. 場地欄位 -------------------------------------------------
     一般用 stage 當欄位；但若某個 stage 底下有多個不同 location
     （2025 的 Insights Forum、各年的 Side Programmes），就改用 location，
     這樣 lounge 與各會議室才會拆成獨立欄位。 */
  var locsByStage = {};
  records.forEach(function (r) {
    var m = locsByStage[r.stage] || (locsByStage[r.stage] = {});
    if (r.location) m[r.location] = true;
  });
  function venueName(r) {
    var multi = Object.keys(locsByStage[r.stage] || {}).length > 1;
    if (multi && r.location) return r.location;
    /* 官網有些場次還沒公布舞台與場地，集中到一欄而不是各自變成看不懂的代碼 */
    return r.stage || r.location || "TBC";
  }

  /* ---- 2. 場地代碼／標籤 ---- */
  var present = {};
  records.forEach(function (r) { present[venueName(r)] = true; });

  var venueOrder = Object.keys(VENUE_CFG).filter(function (n) { return present[n]; });
  Object.keys(present).sort().forEach(function (n) {
    if (!VENUE_CFG[n]) venueOrder.push(n);
  });

  var venueCode = {}, VENUES = [], VENUE_FULL = {}, usedVenue = {};
  venueOrder.forEach(function (name) {
    var cfg  = VENUE_CFG[name];
    var code = uniqueCode(cfg ? cfg[0] : initials(name), usedVenue);
    venueCode[name] = code;
    VENUES.push([code, cfg ? cfg[1] : name.split(",")[0].trim()]);
    VENUE_FULL[code] = cfg ? cfg[2] : name;
  });

  /* ---- 3. 主題 track ---- */
  var trackPresent = {};
  records.forEach(function (r) { trackPresent[r.track || "Others"] = true; });

  var trackOrder = Object.keys(TRACK_CFG).filter(function (n) { return trackPresent[n]; });
  Object.keys(trackPresent).sort().forEach(function (n) {
    if (!TRACK_CFG[n]) trackOrder.push(n);
  });

  var trackCode = {}, TOPICS = {}, COLORS = {}, usedTrack = {}, pi = 0;
  trackOrder.forEach(function (name) {
    var cfg  = TRACK_CFG[name];
    var code = uniqueCode(cfg ? cfg[0] : initials(name), usedTrack);
    trackCode[name] = code;
    TOPICS[code] = [cfg ? cfg[1] : name, name];
    COLORS[code] = cfg ? cfg[2] : (code === "OT" ? GREY : PALETTE[pi++ % PALETTE.length]);
  });
  if (!TOPICS.OT) { TOPICS.OT = ["其他", "Others"]; COLORS.OT = GREY; }

  /* ---- 4. 日期 ---- */
  var dayKeys = [], isoOf = {};
  records.forEach(function (r) {
    var key = r.date || r.day;
    if (!key) return;
    if (dayKeys.indexOf(key) === -1) dayKeys.push(key);
    if (r.date) isoOf[key] = r.date;
  });
  if (dayKeys.every(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); })) dayKeys.sort();

  var dayKeyOf = {};
  dayKeys.forEach(function (k, i) { dayKeyOf[k] = "d" + (i + 1); });

  /* ---- 5. 場次列 ---- */
  var S = [], DESC = {}, RECAP = {};
  records.forEach(function (r) {
    var key = r.date || r.day;
    if (!key || !r.title) return;
    var t = parseTimes(r.datetime);
    if (!t) return;

    var slug = slugOf(r.url);
    var access = ACCESS_MAP[String(r.event_type || "").trim().toLowerCase()] || "O";
    var speakers = String(r.speakers || "").split(";")
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    S.push([
      dayKeyOf[key],                       /* 0 day    */
      venueCode[venueName(r)],             /* 1 場地代碼 */
      t[0],                                /* 2 start  */
      t[1],                                /* 3 end    */
      access,                              /* 4 O/I/P  */
      trackCode[r.track || "Others"] || "OT", /* 5 topic */
      r.title,                             /* 6 title  */
      slug,                                /* 7 slug   */
      speakers,                            /* 8 講者   */
      r.stage || VENUE_FULL[venueCode[venueName(r)]] || "",  /* 9 舞台顯示名 */
      String(r.url || "")                  /* 10 官方場次頁面（直接用 CSV 的 url）*/
    ]);

    if (slug && (r.description || r.description_zh)) {
      DESC[slug] = [r.description || "", r.description_zh || ""];
    }
    /* recap_zh：有回放的場次才有，人工整理的繁中重點（Markdown 子集）*/
    if (slug && r.recap_zh && r.recap_zh.trim()) RECAP[slug] = r.recap_zh.trim();
  });

  /* 同一天同欄位依開始時間排序，日曆與清單才不會亂跳 */
  var toMin = function (t) { var p = t.split(":"); return +p[0] * 60 + +p[1]; };
  S.sort(function (a, b) {
    if (a[0] !== b[0]) return a[0] < b[0] ? -1 : 1;
    return toMin(a[2]) - toMin(b[2]);
  });

  /* ---- 6. DAYS / DAYMETA（欄位與標籤都由當天實際資料推導）---- */
  var DAYS = [], DAYMETA = {};
  dayKeys.forEach(function (key) {
    var k = dayKeyOf[key];
    var rows = records.filter(function (r) { return (r.date || r.day) === key; });
    var stages = {};
    rows.forEach(function (r) { if (r.stage) stages[r.stage] = true; });
    var stageNames = Object.keys(stages);

    var codesHere = {};
    rows.forEach(function (r) { codesHere[venueCode[venueName(r)]] = true; });

    var info = dayInfo(key, isoOf[key]);
    DAYS.push({ k: k, cols: VENUES.filter(function (v) { return codesHere[v[0]]; }) });
    DAYMETA[k] = {
      wd: info.wd, wdz: info.wdz, date: info.date, md: info.md, iso: info.iso,
      label: stageNames.length === 1 ? stageNames[0] : "Main Stages"
    };
  });

  return { VENUES: VENUES, VENUE_FULL: VENUE_FULL, TOPICS: TOPICS, COLORS: COLORS,
           U: OFFICIAL, S: S, DAYS: DAYS, DAYMETA: DAYMETA, DESC: DESC, RECAP: RECAP };
}

/* 主題配色以 <style> 注入，因此 track 數量不受既有 CSS class 限制 */
function injectTrackColors(colors) {
  var css = Object.keys(colors).map(function (c) {
    return ".tk-" + c + "{--c:" + colors[c] + ";}";
  }).join("\n");
  var el = document.createElement("style");
  el.id = "sff-track-colors";
  el.textContent = css;
  document.head.appendChild(el);
}

/* ============================================================
   狀態畫面（載入中／空資料／讀不到檔案）
   ============================================================ */
function paint(html) {
  var root = document.getElementById("root");
  if (root) root.innerHTML = '<div class="boot">' + html + "</div>";
}

function showLoading() {
  paint('<div class="boot-spin"></div><p class="boot-msg">載入議程資料…<br><span>Loading agenda…</span></p>');
}

function showEmpty() {
  paint(
    '<h1 class="boot-h">尚未匯入議程資料</h1>' +
    '<p class="boot-msg">No agenda data yet</p>' +
    '<p class="boot-body"><code>agenda.csv</code> 目前是空的。執行下列指令抓取 Singapore FinTech Festival 2026 的議程：</p>' +
    '<pre class="boot-pre">python3 -m pip install -r requirements.txt\npython3 scrape_sff_agenda.py</pre>' +
    '<p class="boot-body">抓完後重新整理本頁即可。</p>' +
    '<p class="boot-body"><a href="archive/2025/">→ 2025 年議程存檔</a></p>'
  );
}

function showFileFallback(reason) {
  paint(
    '<h1 class="boot-h">需要透過伺服器開啟</h1>' +
    '<p class="boot-msg">Load <code>agenda.csv</code> to continue</p>' +
    '<p class="boot-body">瀏覽器不允許 <code>file://</code> 頁面讀取旁邊的 CSV（CORS 限制），' +
    '所以直接雙擊開啟時讀不到 <code>agenda.csv</code>。兩種解法：</p>' +
    '<p class="boot-body"><b>1. 起完整的本機服務</b>（推薦，前端與 Agent API 共用同一個網址）：</p>' +
    '<pre class="boot-pre">uvicorn agent.main:app --host 127.0.0.1 --port 8765\n# 然後開 http://127.0.0.1:8765/</pre>' +
    '<p class="boot-body"><b>2. 直接把 <code>agenda.csv</code> 拖進來</b>，或點下面的按鈕選檔：</p>' +
    '<label class="boot-drop" id="sff-drop">' +
    '  <input type="file" accept=".csv,text/csv" id="sff-file" hidden>' +
    '  <span>拖放 agenda.csv 到這裡，或<b>點此選擇檔案</b></span>' +
    '</label>' +
    '<p class="boot-note">' + reason + "</p>"
  );

  var drop = document.getElementById("sff-drop");
  var input = document.getElementById("sff-file");

  function readFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { showLoading(); start(String(fr.result)); };
    fr.onerror = function () { paint('<p class="boot-msg">讀取檔案失敗，請再試一次。</p>'); };
    fr.readAsText(file, "utf-8");
  }

  input.addEventListener("change", function () { readFile(input.files[0]); });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });
}

/* ============================================================
   啟動
   ============================================================ */
function start(text) {
  var data;
  try {
    data = build(toRecords(parseCSV(text)));
  } catch (err) {
    paint('<h1 class="boot-h">議程資料解析失敗</h1><p class="boot-body">' +
          'agenda.csv 的格式看起來不對。<br><code>' + String(err && err.message || err) + "</code></p>");
    return;
  }

  if (!data.S.length) { showEmpty(); return; }

  window.SFF = {
    VENUES: data.VENUES, VENUE_FULL: data.VENUE_FULL,
    TOPICS: data.TOPICS, U: data.U, S: data.S,
    DAYS: data.DAYS, DAYMETA: data.DAYMETA
  };
  window.SFF_DESC = data.DESC;
  window.SFF_RECAP = data.RECAP;

  injectTrackColors(data.COLORS);

  /* 介面那支 script 是 text/babel，轉譯完成的時間點不一定比 fetch 早，
     所以兩邊互相握手，誰後到誰負責 mount。 */
  window.__sffDataReady = true;
  if (typeof window.__sffMount === "function") window.__sffMount();
}

showLoading();

fetch(CSV_URL, { cache: "no-cache" })
  .then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
    return res.text();
  })
  .then(start)
  .catch(function (err) {
    showFileFallback("讀取 " + CSV_URL + " 失敗：" + String(err && err.message || err));
  });

})();
</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel">
/* ============================================================
   SFF 2026 Agenda — React app (Apple Calendar inspired)

   資料由上方的載入器從 agenda.csv 組出來，是非同步的，所以 D / DESC 這裡
   先留空，等資料就緒再由 initData() 填入（見檔案最後的 mount 交接）。
   ============================================================ */
const { useState, useEffect, useMemo, useRef } = React;
let D = {}, DESC = {}, RECAP = {}, DAYMETA = {}, COLS_ALL = [];
function initData() {
  D = window.SFF || {};
  DESC = window.SFF_DESC || {};
  RECAP = window.SFF_RECAP || {};
  DAYMETA = D.DAYMETA || {};
  COLS_ALL = D.VENUES || [];
}

/* ---- language (description EN/ZH), persisted in localStorage ---- */
function useLang() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("sff-lang") || "zh"; } catch (e) { return "zh"; }
  });
  const set = (v) => { setLang(v); try { localStorage.setItem("sff-lang", v); } catch (e) {} };
  return [lang, set];
}
/* description text for a slug in the chosen language (falls back to English) */
const descText = (slug, lang) => {
  const d = DESC[slug];
  if (!d) return "";
  return (lang === "zh" ? d[1] : d[0]) || d[0] || "";
};
/* ---- 回放重點（recap_zh）：只認 ## 標題、清單（可一層縮排）、表格與 **粗體** ---- */
const hasRecap = (slug) => !!RECAP[slug];
const recapHtml = (md) => {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const out = [];
  let list = null, table = null;   /* list = { tag, start, items: [{ html, subs: [] }] } */
  const closeList = () => {
    if (!list) return;
    const open = "<" + list.tag + (list.start ? ' start="' + list.start + '"' : "") + ">";
    out.push(open + list.items.map((it) =>
      "<li>" + it.html + (it.subs.length ? "<ul>" + it.subs.map((x) => "<li>" + x + "</li>").join("") + "</ul>" : "") + "</li>"
    ).join("") + "</" + list.tag + ">");
    list = null;
  };
  const closeTable = () => { if (table) { out.push("<table>" + table.join("") + "</table>"); table = null; } };
  md.split("\n").forEach((raw) => {
    const line = raw.replace(/\s+$/, "");
    let m;
    if (/^\|/.test(line)) {
      closeList();
      if (/^\|[\s|:-]+\|$/.test(line)) return;              /* 表格分隔列 */
      const tag = table ? "td" : "th";
      table = table || [];
      table.push("<tr>" + line.replace(/^\||\|$/g, "").split("|")
        .map((c) => "<" + tag + ">" + inline(c.trim()) + "</" + tag + ">").join("") + "</tr>");
      return;
    }
    closeTable();
    if (!line.trim()) return;
    if ((m = line.match(/^##\s+(.*)/))) { closeList(); out.push("<h4>" + inline(m[1]) + "</h4>"); return; }
    if (list && (m = line.match(/^\s{2,}(?:\d+\.|[-*])\s+(.*)/))) {   /* 第二層清單 */
      list.items[list.items.length - 1].subs.push(inline(m[1])); return;
    }
    if ((m = line.match(/^(?:(\d+)\.|[-*])\s+(.*)/))) {
      const tag = m[1] ? "ol" : "ul";
      if (list && list.tag !== tag) closeList();
      if (!list) list = { tag, start: m[1] && m[1] !== "1" ? m[1] : "", items: [] };
      list.items.push({ html: inline(m[2]), subs: [] }); return;
    }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
  });
  closeList(); closeTable();
  return out.join("");
};

/* split a paragraph on _emphasis_ markers into React nodes */
const renderEmphasis = (text) =>
  text.split(/_([^_\n]+)_/).map((seg, i) => (i % 2 === 1 ? <em key={i}>{seg}</em> : seg));

/* ---- day metadata（wd / wdz / date / md / label 由載入器依 CSV 日期推導）---- */
const ACCESS = {
  O: { en: "Open", zh: "開放參加", cls: "open", mk: "" },
  I: { en: "Invite-Only", zh: "邀請制", cls: "invite", mk: "🔒" },

};

const accOf = (code) => ACCESS[code] || ACCESS.O;

/* 篩選用的 Set 切換：回傳新的 Set，不就地修改 */
const toggleIn = (set, key) => {
  const n = new Set(set);
  n.has(key) ? n.delete(key) : n.add(key);
  return n;
};

/* 議程篩選：主題 + 參加資格（🔒 邀請制 / ◆ 付費）。
   兩組條件是 AND，組內是 OR；空的 Set 代表不篩選。 */
const applyFilters = (arr, topics, access) => {
  if (topics.size) arr = arr.filter((s) => topics.has(s[5]));
  if (access.size) arr = arr.filter((s) => access.has(s[4]));
  return arr;
};

/* 桌機圖例 / 手機篩選面板共用的參加資格選項。

   （例如 2026 的資料完全沒有邀請制場次）。 */
const ACCESS_FILTERS = [["I", "Invite-Only", "邀請制"], ["P", "Premium", "付費"]];
const accessOptions = () => {
  const present = new Set(D.S.map((s) => s[4]));

/* ---- helpers ---- */
const mins = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const pad2 = (n) => String(n).padStart(2, "0");
const clock = (t) => { const [h, m] = t.split(":"); return pad2(+h) + ":" + m; };
const fmtMin = (m) => pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
const durLabel = (a, b) => {
  const d = mins(b) - mins(a);
  if (d >= 60) { const h = Math.floor(d / 60), mm = d % 60; return h + "h" + (mm ? " " + mm + "m" : ""); }
  return d + "m";
};
/* 每一天的欄位就是那天實際有場次的場地（載入器已按設定順序排好）*/
const colsOf = (day) => (day && day.cols) || [];

/* ============================================================
   小幫手 Bot — 純前端關鍵字推薦引擎（無 API / 無對外請求）
   ============================================================ */

/* topic code -> 觸發詞（全小寫，中英 + 縮寫）。刻意不含 OT。 */
const BOT_SYN = {
  AQ: ["ai", "a.i", "artificial intelligence", "人工智慧", "人工智能", "智能", "quantum", "量子",
       "agentic", "agent", "machine learning", "機器學習", "深度學習", "llm", "genai", "generative",

       "token", "tokenis", "tokeniz", "代幣", "通證", "stablecoin", "穩定幣", "defi", "ethereum",

};

/* 泛詞：不參與標題/說明評分（仍可參與主題/同義詞比對），避免泛查淹沒 */
const BOT_STOP = new Set(["finance", "financial", "session", "sessions", "singapore", "fintech",
  "future", "digital", "global", "world", "the", "and", "for", "with", "金融", "未來", "場次", "活動"]);

/* CJK 偵測（用於片語子字串比對） */
const HAS_CJK = (s) => /[㐀-鿿]/.test(s);

/* 拆解查詢：raw 全字串 + latin 英數 token 陣列 */
const botTokens = (q) => {
  const raw = (q || "").toLowerCase().trim();
  const latin = raw.split(/[^a-z0-9]+/i).filter((t) => t.length >= 2);
  return { raw, latin };
};

/* 推斷主題：回傳 Map<code, 命中觸發詞數> */
const botTopicHits = (qInfo) => {
  const { raw, latin } = qInfo;
  const latinSet = new Set(latin);
  const hits = new Map();
  for (const code in BOT_SYN) {
    let n = 0;
    for (const trig of BOT_SYN[code]) {
      const isShortLatin = trig.length <= 3 && /^[a-z0-9.]+$/.test(trig);
      const hit = isShortLatin ? latinSet.has(trig) : raw.includes(trig);
      if (hit) n++;
    }
    if (n > 0) hits.set(code, n);
  }
  return hits;
};

/* 對單一場次評分 */
const scoreSession = (s, qInfo) => {
  const { raw, latin, topicHits } = qInfo;
  const code = s[5];
  let score = 0;

  // 主題命中（最高權重）
  if (topicHits.has(code)) score += 50 + 5 * topicHits.get(code);

  // 主題標籤字面（中/英）
  const tp = D.TOPICS[code];
  if (tp) {
    const labelZh = tp[0].toLowerCase(), labelEn = tp[1].toLowerCase();
    if (latin.some((t) => labelEn.includes(t)) || (HAS_CJK(raw) && (labelZh.includes(raw) || raw.includes(labelZh))))
      score += 20;
  }

  // 標題關鍵字（英文 token，去泛詞）
  const title = (s[6] || "").toLowerCase();
  let titleHits = 0;
  for (const t of new Set(latin)) {
    if (t.length >= 3 && !BOT_STOP.has(t) && title.includes(t)) titleHits++;
  }
  score += Math.min(36, titleHits * 12);
  // 標題 CJK 片語
  if (HAS_CJK(raw) && !BOT_STOP.has(raw) && title.includes(raw)) score += 12;

  // 說明關鍵字（兩語都查）
  const desc = ((descText(s[7], "en") || "") + "\n" + (descText(s[7], "zh") || "")).toLowerCase();
  if (desc) {
    let descHits = 0;
    for (const t of new Set(latin)) {
      if (t.length >= 3 && !BOT_STOP.has(t) && desc.includes(t)) descHits++;
    }
    score += Math.min(20, descHits * 5);
    if (HAS_CJK(raw) && !BOT_STOP.has(raw) && desc.includes(raw)) score += 5;
  }

  // 講者
  const spk = (s[8] || []).join(" · ").toLowerCase();
  if (spk) {
    let spkHits = 0;
    for (const t of new Set(latin)) {
      if (t.length >= 3 && spk.includes(t)) spkHits++;
    }
    if (HAS_CJK(raw) && spk.includes(raw)) spkHits++;
    score += Math.min(24, spkHits * 8);
  }

  // Open 場次微調（僅在已有內容匹配時，避免無關場次靠此上榜）
  if (score > 0 && s[4] === "O") score += 1;

  return score;
};

/* 推薦：對全部 5 天場次評分，回傳前 N 名 */
const recommend = (query, N = 6) => {
  const base = botTokens(query);
  if (!base.raw) return { items: [], topicHits: [] };
  const topicHits = botTopicHits(base);
  const qInfo = { ...base, topicHits };
  const scored = [];
  for (const s of D.S) {
    const sc = scoreSession(s, qInfo);
    if (sc > 0) scored.push({ s, sc });
  }
  scored.sort((a, b) => b.sc - a.sc || mins(a.s[2]) - mins(b.s[2]) || a.s[0].localeCompare(b.s[0]));
  return { items: scored.slice(0, N).map((x) => x.s), topicHits: [...topicHits.keys()] };
};

/* ============================================================
   小幫手 Bot — AI 模式：接 agent/api.py。連不上就退回上面的關鍵字引擎，
   所以這個檔案單獨開、放在 GitHub Pages 上都照常能用，也不會有金鑰進到前端。
   ============================================================ */

/* uvicorn agent.main:app 會把前端與 Agent API 放在同一個 origin，桌機與手機都可
   直接連線且不需要 CORS 設定。靜態開啟時仍可用 ?agent=<url> 指定外部 Agent；
   ?agent= 留空則清掉既有設定。 */
const AGENT_DEFAULT = "http://127.0.0.1:8765";
const AGENT_LS = "sff-agent-url", THREAD_LS = "sff-agent-thread", MODE_LS = "sff-bot-mode";

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => {
  try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {}
};

let AGENT_URL = null;
function agentEndpoint() {
  if (AGENT_URL !== null) return AGENT_URL;
  const q = new URLSearchParams(location.search).get("agent");
  if (q !== null) lsSet(AGENT_LS, q.trim() || null);
  const sameOrigin = /^https?:$/.test(location.protocol) ? location.origin : "";
  const fileFallback = location.protocol === "file:" ? AGENT_DEFAULT : "";
  AGENT_URL = (lsGet(AGENT_LS) || sameOrigin || fileFallback).replace(/\/+$/, "");
  return AGENT_URL;
}

/* 這個瀏覽器的對話識別；清除對話就換一組，等於開一段新的記憶。 */
function agentThread(fresh) {
  let id = fresh ? null : lsGet(THREAD_LS);
  if (!id) { id = "web-" + Math.random().toString(36).slice(2, 10); lsSet(THREAD_LS, id); }
  return id;
}

function agentFetch(url, path, init, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url + path, { ...init, signal: ctrl.signal })
    .finally(() => clearTimeout(timer));
}

const agentHealth = (url) =>
  agentFetch(url, "/health", {}, 4000).then((r) => r.ok).catch(() => false);

function agentAsk(url, question, thread) {
  return agentFetch(url, "/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: question, thread_id: thread }),
  }, 120000).then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then((data) => {
    const answer = String((data && data.answer) || "").trim();
    if (!answer) throw new Error("empty answer");
    return answer;
  });
}

/* "AGND441" -> 場次列。slug 的第一段就是 agent 的 session_id，兩邊同一個來源。 */
let SID_MAP = null;
function sessionById(id) {
  if (!SID_MAP) {
    SID_MAP = new Map();
    D.S.forEach((s) => {
      const k = String(s[7] || "").split("-")[0].toUpperCase();
      if (k && !SID_MAP.has(k)) SID_MAP.set(k, s);
    });
  }
  return SID_MAP.get(String(id).toUpperCase()) || null;
}

/* Agent 回的是純文字，只會夾三種東西：場次 ID、**粗體**、「- 」開頭的清單。
   就處理這三種，其餘原樣呈現 —— 不為了聊天框引進 markdown 套件。 */
const AGENT_SID_RE = /\b(AGND\d+)\b/g;

/* 把文字裡的場次 ID 換成可點的連結（點了開共用的場次詳情） */
function agentIds(text, key, onSelect) {
  const out = []; let last = 0, m;
  AGENT_SID_RE.lastIndex = 0;
  while ((m = AGENT_SID_RE.exec(text))) {
    const s = sessionById(m[1]);
    if (!s) continue;  // 講到不存在的 ID 就當普通文字，不做成死連結
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(
      <button className="bot-sid" key={key + "s" + m.index} title={s[6]} onClick={() => onSelect(s)}>
        {m[1]}
      </button>
    );
    last = m.index + m[1].length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

/* **粗體** 切段，段內再處理場次 ID */
function agentRich(text, key, onSelect) {
  return String(text).split(/\*\*(.+?)\*\*/g).map((chunk, i) => (
    i % 2
      ? <strong key={key + "b" + i}>{agentIds(chunk, key + "b" + i, onSelect)}</strong>
      : <React.Fragment key={key + "t" + i}>{agentIds(chunk, key + "t" + i, onSelect)}</React.Fragment>
  ));
}

function AgentAnswer({ text, onSelect }) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  return (
    <React.Fragment>
      {lines.map((line, i) => {
        const t = line.trim();
        if (!t) return null;
        const bullet = /^[-*•]\s+/.test(t);
        return (
          <div className={bullet ? "bot-li" : "bot-p"} key={i}>
            {bullet ? "• " : ""}
            {agentRich(bullet ? t.replace(/^[-*•]\s+/, "") : t, "l" + i, onSelect)}
          </div>
        );
      })}
    </React.Fragment>
  );
}

/* 組裝開場句（render 時依 lang 重算） */
const botIntro = (topicHits, count, lang) => {
  const T = BOT_T[lang] || BOT_T.en;
  const codes = (topicHits || []).filter((c) => c !== "OT" && D.TOPICS[c]);
  if (!codes.length) return T.generic(count);
  const sep = lang === "zh" ? "、" : ", ";
  const names = codes.map((c) => D.TOPICS[c][lang === "zh" ? 0 : 1]).join(sep);
  return T.topical(count, names);
};

/* assign overlap lanes within a column */
function computeLanes(evs) {
  const sorted = [...evs].sort((a, b) => mins(a[2]) - mins(b[2]) || mins(a[3]) - mins(b[3]));
  const laneEnd = []; const laneOf = new Map();
  sorted.forEach((ev) => {
    let p = laneEnd.findIndex((end) => mins(ev[2]) >= end);
    if (p < 0) { p = laneEnd.length; laneEnd.push(0); }
    laneEnd[p] = mins(ev[3]); laneOf.set(ev, p);
  });
  return { laneOf, count: Math.max(1, laneEnd.length) };
}

/* ============================================================ */
function EventChip({ s, lane, lanes, top, h, compact, onSelect }) {
  const lines = Math.max(1, Math.min(6, Math.floor((h - 16) / 15)));
  const mk = accOf(s[4]).mk;
  return (
    <div
      className={"ev tk-" + s[5] + (compact ? " cmp" : "")}
      style={{
        top: top + "px",
        left: `calc(${(lane / lanes) * 100}% + 2px)`,
        width: `calc(${100 / lanes}% - 4px)`,
        "--h": h + "px",
        "--lines": lines,
      }}
      onClick={() => onSelect(s)}
    >
      {mk && !compact && <span className="mk">{mk}</span>}
      <span className="etm">{compact && mk ? mk + " " + clock(s[2]) : clock(s[2])}</span>
      <span className="ett">{s[6]}</span>
    </div>
  );
}

/* 1c layout: short sessions become single-line chips, and every chip is nudged
   down so it never covers the one after it. A tick marks the true start time. */
function layoutColumn(evs, laneOf, dayStart, pxPerMin, minH, compactMax) {
  const CMP_H = 22, GAP = 3;
  const out = []; const ticks = []; const prevBottom = new Map();
  [...evs].sort((a, b) => mins(a[2]) - mins(b[2]) || mins(a[3]) - mins(b[3])).forEach((s) => {
    const lane = laneOf.get(s) || 0;
    const exact = (mins(s[2]) - dayStart) * pxPerMin;
    const dur = mins(s[3]) - mins(s[2]);
    const compact = compactMax > 0 && dur <= compactMax;
    const h = compact ? CMP_H : Math.max(minH, dur * pxPerMin);
    const floor = prevBottom.has(lane) ? prevBottom.get(lane) + GAP : -Infinity;
    const top = Math.max(exact, floor);
    prevBottom.set(lane, top + h);
    if (top - exact > 0.5) ticks.push({ id: s[7], top: exact, track: s[5] });
    out.push({ s, lane, top, h, compact });
  });
  return { placed: out, ticks, bottom: Math.max(0, ...out.map((p) => p.top + p.h)) };
}

function CalendarView({ day, sessions, hourHeight, colWidth, quarterLines, compactMax, onSelect }) {
  const pxPerMin = hourHeight / 60;
  const minH = Math.max(28, hourHeight * 0.3);

  const master = colsOf(day);
  const used = master.filter(([k]) => sessions.some((s) => s[1] === k));
  if (!used.length) return <div className="empty">尚無可顯示的場次。</div>;

  const dayStart = Math.floor(Math.min(...sessions.map((s) => mins(s[2]))) / 60) * 60;
  const dayEnd = Math.ceil(Math.max(...sessions.map((s) => mins(s[3]))) / 60) * 60;
  const totalMin = dayEnd - dayStart;
  const bodyH = totalMin * pxPerMin;

  const laneData = {}; const layout = {};
  used.forEach(([k]) => {
    const evs = sessions.filter((s) => s[1] === k);
    laneData[k] = computeLanes(evs);
    layout[k] = layoutColumn(evs, laneData[k].laneOf, dayStart, pxPerMin, minH, compactMax);
  });
  const gridH = Math.max(bodyH, ...used.map(([k]) => layout[k].bottom + 4));

  const hours = [];
  for (let m = dayStart; m <= dayEnd; m += 60) hours.push(m);

  const bg = (() => {
    const layers = [`linear-gradient(var(--separator) 1px, transparent 1px)`];
    const sizes = [`100% ${60 * pxPerMin}px`];
    if (quarterLines) { layers.push(`linear-gradient(var(--hairline) 1px, transparent 1px)`); sizes.push(`100% ${15 * pxPerMin}px`); }
    return { backgroundImage: layers.join(","), backgroundSize: sizes.join(",") };
  })();

  const n = used.length;
  const tpl = `var(--gutter-w) repeat(${n}, minmax(${colWidth}px, 1fr))`;

  return (
    <div className="scroll">
      <div className="cal" style={{ gridTemplateColumns: tpl }}>
        <div className="corner" style={{ gridColumn: 1, gridRow: 1 }} />
        {used.map(([k, name], i) => (
          <div className="colhead" key={"h" + k} style={{ gridColumn: i + 2, gridRow: 1 }}>
            <span className="code">{k}</span>
            <span className="name" title={name}>{name}</span>
          </div>
        ))}
        <div className="gutter" style={{ gridColumn: 1, gridRow: 2, height: gridH + "px" }}>
          {hours.map((m, i) => (
            <span className="hourlabel" key={m}
              style={{ top: (m - dayStart) * pxPerMin + "px", transform: i === 0 ? "translateY(2px)" : "translateY(-50%)" }}>
              {fmtMin(m)}
            </span>
          ))}
        </div>
        {used.map(([k], i) => {
          const { count } = laneData[k];
          const { placed, ticks } = layout[k];
          return (
            <div className="colbody" key={"b" + k} style={{ gridColumn: i + 2, gridRow: 2, height: gridH + "px", ...bg }}>
              {ticks.map((t) => (
                <div className={"tick tk-" + t.track} key={"t" + t.id} style={{ top: t.top + "px" }} />
              ))}
              {placed.map((p) => (
                <EventChip key={p.s[7]} s={p.s} lane={p.lane} lanes={count}
                  top={p.top} h={p.h} compact={p.compact} onSelect={onSelect} />
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function useMediaQuery(q) {
  const [m, setM] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const mq = window.matchMedia(q);
    const fn = (e) => setM(e.matches);
    mq.addEventListener("change", fn);
    return () => mq.removeEventListener("change", fn);
  }, [q]);
  return m;
}

/* Swipe-down-to-dismiss for bottom sheets (filter sheet + mobile detail card).
   The drag only starts when the sheet content is scrolled to the top, so it
   never fights with normal scrolling. Release past the threshold (or with a
   quick flick) calls onClose; otherwise it snaps back. */
function useSwipeDismiss(onClose) {
  const ref = React.useRef(null);     // the scrollable sheet element
  const st = React.useRef(null);      // live drag state { y, t, d }
  const [dy, setDy] = useState(0);
  const [dragging, setDragging] = useState(false);

  const onTouchStart = (e) => {
    const el = ref.current;
    if (el && el.scrollTop > 0) { st.current = null; return; }
    st.current = { y: e.touches[0].clientY, t: Date.now(), d: 0 };
    setDragging(true);
  };
  const onTouchMove = (e) => {
    const s = st.current; if (!s) return;
    const el = ref.current;
    if (el && el.scrollTop > 0) { st.current = null; setDy(0); setDragging(false); return; }
    const delta = e.touches[0].clientY - s.y;
    if (delta <= 0) { s.d = 0; setDy(0); return; }
    s.d = delta; setDy(delta);
  };
  const onTouchEnd = () => {
    const s = st.current; if (!s) return;
    const delta = s.d, dt = Date.now() - s.t;
    st.current = null; setDragging(false); setDy(0);
    if (delta > 110 || (delta > 40 && dt < 240)) onClose();
  };

  const style = dragging ? { transform: "translateY(" + dy + "px)", transition: "none" } : undefined;
  return { ref, style, handlers: { onTouchStart, onTouchMove, onTouchEnd } };
}

/* ============================================================
   回放筆記 — 活動結束後的首頁
   ------------------------------------------------------------
   只列出 agenda.csv 裡有 recap_zh 的場次。路由用 hash：
     ""            回放首頁
     "#/agenda"    完整議程（原本的日曆／清單）
     "#/r/AGND631" 回放首頁 + 打開該場的閱讀面板
   ============================================================ */
const ICONS = {
  search: <><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></>,
  sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></>,
  moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
  x: <path d="M18 6 6 18M6 6l12 12" />,
  left: <path d="m15 18-6-6 6-6" />,
  right: <path d="m9 18 6-6-6-6" />,
  ext: <path d="M7 17 17 7M8 7h9v9" />,
  link: <><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></>,
  chat: <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />,
};
function Icon({ name, size }) {
  const st = size ? { width: size, height: size } : undefined;
  return <svg className="ico" viewBox="0 0 24 24" style={st} aria-hidden="true">{ICONS[name]}</svg>;
}

const sidOf = (s) => String(s[7] || "").split("-")[0].toUpperCase();

/* ---- hash 路由 ---- */
const parseRoute = (h) => {
  h = (h || "").replace(/^#\/?/, "");
  if (/^agenda\b/.test(h)) return { page: "agenda", sid: null };
  const m = h.match(/^r\/(AGND\d+)/i);
  return { page: "replay", sid: m ? m[1].toUpperCase() : null };
};
function useRoute() {
  const [route, setRoute] = useState(() => parseRoute(location.hash));
  useEffect(() => {
    const fn = () => setRoute(parseRoute(location.hash));
    window.addEventListener("hashchange", fn);
    return () => window.removeEventListener("hashchange", fn);
  }, []);
  /* replace=true：上一場／下一場不要塞滿瀏覽器的上一頁 */
  const go = (hash, replace) => {
    if (replace) {
      history.replaceState(null, "", hash ? hash : location.pathname + location.search);
      setRoute(parseRoute(hash));
    } else if (!hash) {
      history.pushState(null, "", location.pathname + location.search);
      setRoute(parseRoute(""));
    } else {
      location.hash = hash;
    }
  };
  return [route, go];
}

/* ---- 回放內容拆成「一句話結論」與其餘段落 ---- */
const splitRecap = (md) => {
  const m = md.match(/^##\s*一句話結論\s*\n([\s\S]*?)(?=\n##\s|$)/);
  if (!m) return { lead: "", rest: md };
  return { lead: m[1].trim(), rest: md.slice(m[0].length).trim() };
};
/* <ol start="5"> 換成計數器起點，閱讀面板的編號是自己畫的 */
const readerHtml = (md) => recapHtml(md).replace(/<ol start="(\d+)">/g, (_, n) => '<ol style="counter-reset: rb ' + (n - 1) + '">');
const plain = (md) => md.replace(/\*\*/g, "").replace(/^#+\s*/gm, "");

/* 回放資料：每場預先算好搜尋字串與結論，元件裡只做篩選 */
let REPLAY = null;
function replayData() {
  if (REPLAY) return REPLAY;
  const rows = D.S.filter((s) => hasRecap(s[7]));
  const stageOrder = COLS_ALL.map(([k]) => k);
  rows.sort((a, b) => a[0].localeCompare(b[0]) || mins(a[2]) - mins(b[2]) ||
    stageOrder.indexOf(a[1]) - stageOrder.indexOf(b[1]));
  const items = rows.map((s) => {
    const md = RECAP[s[7]];
    const { lead, rest } = splitRecap(md);
    return {
      s, sid: sidOf(s), lead, rest,
      hay: [s[6], (s[8] || []).join(" "), s[9], plain(md)].join(" ").toLowerCase(),
    };
  });
  const days = D.DAYS.filter((d) => items.some((it) => it.s[0] === d.k)).map((d) => d.k);
  const stages = stageOrder.filter((k) => items.some((it) => it.s[1] === k));
  const topics = Object.keys(D.TOPICS).filter((k) => items.some((it) => it.s[5] === k));
  let lo = 24 * 60, hi = 0;
  items.forEach(({ s }) => { lo = Math.min(lo, mins(s[2])); hi = Math.max(hi, mins(s[3])); });
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  REPLAY = { items, days, stages, topics, lo, hi, bySid: new Map(items.map((it) => [it.sid, it])) };
  return REPLAY;
}
const stageName = (code) => { const f = COLS_ALL.find(([k]) => k === code); return f ? f[1].split(" ‧ ")[0].replace(/ Stage$/, "") : code; };
const dayLong = (k) => { const m = dayMeta(k); const [mo, d] = (m.md || "").split("/"); return mo ? +mo + " 月 " + +d + " 日 " + m.wdz : m.md; };
const dayShort = (k) => { const m = dayMeta(k); return (m.md || k) + " " + (m.wdz || "").replace("週", ""); };
const durMin = (s) => mins(s[3]) - mins(s[2]);

/* ---- 回放地圖：每天一欄、每個舞台一列，每場是一條依時間定位的刻度 ---- */
function ReplayMap({ R, match, onOpen }) {
  const [hot, setHot] = useState(null);
  const span = R.hi - R.lo;
  const pct = (m) => ((m - R.lo) / span) * 100 + "%";
  const hours = [];
  for (let h = R.lo; h <= R.hi; h += 180) hours.push(h);
  if (hours[hours.length - 1] !== R.hi) hours.push(R.hi);
  const cell = (dk, st) => R.items.filter((it) => it.s[0] === dk && it.s[1] === st);
  const hit = hot && R.bySid.get(hot);
  const stacked = useMediaQuery("(max-width: 720px)");
  const dayHead = (dk) => (
    <div className="rmap-dh" key={"h" + dk}><b>{dayShort(dk)}</b><span>{R.items.filter((it) => it.s[0] === dk).length} 場</span></div>
  );
  const cellEl = (dk, st) => (
    <div className="rmap-cell" key={dk + st} style={{ "--noon": pct(12 * 60) }}>
      {cell(dk, st).map((it) => (
        <button key={it.sid} className={"rtick" + (match.has(it.sid) ? "" : " dim") + (hot === it.sid ? " hot" : "")}
          style={{ left: pct(mins(it.s[2])), width: "calc(" + ((durMin(it.s) / span) * 100) + "% - 2px)" }}
          aria-label={clock(it.s[2]) + " " + it.s[6]}
          onMouseEnter={() => setHot(it.sid)} onFocus={() => setHot(it.sid)}
          onClick={() => onOpen(it.sid)} />
      ))}
    </div>
  );
  const axis = (dk) => (
    <div className="rmap-axis" key={"a" + dk}>{hours.map((h) => <span key={h} style={{ left: pct(h) }}>{pad2(h / 60)}</span>)}</div>
  );
  return (
    <section className="rmap" aria-label="回放地圖" onMouseLeave={() => setHot(null)}>
      <div className="rmap-head">
        <h2 className="rmap-title">回放地圖</h2>
        <span className="rmap-hint">每一條是一場演講，長度就是時長</span>
      </div>
      {/* 桌機：天是欄、舞台是列。手機：一天一段，往下排 */}
      <div className="rmap-grid" style={{ "--days": stacked ? 1 : R.days.length }}>
        {stacked ? R.days.map((dk) => (
          <React.Fragment key={dk}>
            {dayHead(dk)}
            {R.stages.map((st) => <React.Fragment key={st}><div className="rmap-sl">{stageName(st)}</div>{cellEl(dk, st)}</React.Fragment>)}
            <div />{axis(dk)}
          </React.Fragment>
        )) : (
          <>
            <div className="rmap-corner" />
            {R.days.map(dayHead)}
            {R.stages.map((st) => (
              <React.Fragment key={st}>
                <div className="rmap-sl">{stageName(st)}</div>
                {R.days.map((dk) => cellEl(dk, st))}
              </React.Fragment>
            ))}
            <div />
            {R.days.map(axis)}
          </>
        )}
      </div>
      <div className="rmap-cap" aria-live="polite">
        {hit ? (
          <>
            <span className="t">{dayShort(hit.s[0])} {clock(hit.s[2])}</span>
            <span className="n">{hit.s[6]}</span>
            <span className="l">{plain(hit.lead)}</span>
          </>
        ) : <span className="idle">{stacked ? "點一下刻度，就打開那一場的重點" : "滑過刻度預覽，點一下就打開那一場的重點"}</span>}
      </div>
    </section>
  );
}

/* ---- 閱讀面板 ---- */
function Reader({ it, list, lang, onClose, onGo }) {
  const idx = list.findIndex((x) => x.sid === it.sid);
  const prev = idx > 0 ? list[idx - 1] : null;
  const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const scRef = useRef(null);
  const [toast, setToast] = useState("");
  useEffect(() => { if (scRef.current) scRef.current.scrollTop = 0; }, [it.sid]);
  useEffect(() => {
    const k = (e) => {
      if (e.key === "Escape") onClose();
      else if (e.key === "ArrowLeft" && prev) onGo(prev.sid);
      else if (e.key === "ArrowRight" && next) onGo(next.sid);
    };
    document.addEventListener("keydown", k);
    return () => document.removeEventListener("keydown", k);
  }, [prev, next, onClose, onGo]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 1600); return () => clearTimeout(t); }, [toast]);
  const copy = () => {
    const url = location.origin + location.pathname + "#/r/" + it.sid;
    const done = () => setToast("已複製這一場的連結");
    try { navigator.clipboard.writeText(url).then(done, () => setToast(url)); } catch (e) { setToast(url); }
  };
  const s = it.s, tp = D.TOPICS[s[5]] || ["", ""];
  return (
    <>
      <div className="reader-ov" onClick={onClose} />
      <aside className="reader" role="dialog" aria-modal="true" aria-label={s[6]}>
        <div className="reader-bar">
          <button className="tool-btn" onClick={onClose} aria-label="關閉"><Icon name="x" /></button>
          <span className="pos">{idx + 1} / {list.length}</span>
          <button className="tool-btn" disabled={!prev} onClick={() => prev && onGo(prev.sid)} aria-label="上一場"><Icon name="left" /></button>
          <button className="tool-btn" disabled={!next} onClick={() => next && onGo(next.sid)} aria-label="下一場"><Icon name="right" /></button>
          <span className="sp" />
          <button className="tool-btn" onClick={copy}><Icon name="link" size={14} />複製連結</button>
          <a className="tool-btn" href={s[10] || D.U + s[7]} target="_blank" rel="noreferrer">官方頁面<Icon name="ext" size={14} /></a>
        </div>
        <div className="reader-scroll" ref={scRef}>
          <article className="reader-doc">
            <div className="meta"><i>{dayShort(s[0])}</i> · {clock(s[2])}–{clock(s[3])} · {stageName(s[1])} Stage · {tp[lang === "zh" ? 0 : 1]}</div>
            <h1>{s[6]}</h1>
            {(s[8] || []).length > 0 && <div className="spk">{s[8].join("、")}</div>}
            {it.lead && (
              <>
                <div className="lab">一句話結論</div>
                <div className="lead pen" dangerouslySetInnerHTML={{ __html: recapHtml(it.lead) }} />
              </>
            )}
            <div className="rbody pen" dangerouslySetInnerHTML={{ __html: readerHtml(it.rest) }} />
            <p className="reader-note">依官方回放影片的英文自動字幕整理成繁中，人名與數字可能有誤聽，引用前請回看<a href={s[10] || D.U + s[7]} target="_blank" rel="noreferrer">官方場次頁</a>的影片。</p>
            <div className="reader-next">
              <button disabled={!prev} onClick={() => prev && onGo(prev.sid)}>
                <span className="k">上一場</span><span className="v">{prev ? prev.s[6] : ""}</span>
              </button>
              <button className="nx" disabled={!next} onClick={() => next && onGo(next.sid)}>
                <span className="k">下一場</span><span className="v">{next ? next.s[6] : ""}</span>
              </button>
            </div>
          </article>
        </div>
      </aside>
      {toast && <div className="toast" role="status">{toast}</div>}
    </>
  );
}

function ReplayPage({ route, go, lang, setLang, dark, toggleDark }) {
  const R = useMemo(replayData, []);
  const [q, setQ] = useState("");
  const [day, setDay] = useState("");
  const [stage, setStage] = useState("");
  const [topic, setTopic] = useState("");
  const listRef = useRef(null);

  const needle = q.trim().toLowerCase();
  const pass = (it, skip) =>
    (skip === "day" || !day || it.s[0] === day) &&
    (skip === "stage" || !stage || it.s[1] === stage) &&
    (skip === "topic" || !topic || it.s[5] === topic) &&
    (!needle || needle.split(/\s+/).every((w) => it.hay.includes(w)));
  const list = useMemo(() => R.items.filter((it) => pass(it)), [R, needle, day, stage, topic]);
  const match = useMemo(() => new Set(list.map((it) => it.sid)), [list]);
  const opts = (skip, idx, keys, label) => {
    const base = R.items.filter((it) => pass(it, skip));
    return [["", "全部", base.length]].concat(keys.map((k) => [k, label(k), base.filter((it) => it.s[idx] === k).length]));
  };
  const dayOpts = opts("day", 0, R.days, (k) => dayShort(k));
  const stageOpts = opts("stage", 1, R.stages, stageName);
  const topicOpts = opts("topic", 5, R.topics, (k) => D.TOPICS[k][lang === "zh" ? 0 : 1]);
  const filtered = !!(needle || day || stage || topic);
  const reset = () => { setQ(""); setDay(""); setStage(""); setTopic(""); };

  const open = (sid) => go("#/r/" + sid, !!route.sid);
  const close = () => go("", !!route.sid && history.length > 1 ? false : true);
  const cur = route.sid && R.bySid.get(route.sid);
  /* 閱讀時的上一場／下一場跟著目前篩選；若該場不在篩選結果裡，就用全部 118 場 */
  const seq = cur && match.has(cur.sid) ? list : R.items;

  const groups = R.days.map((dk) => [dk, list.filter((it) => it.s[0] === dk)]).filter(([, a]) => a.length);
  const first = R.items[0];

  return (
    <div className={"rp" + (cur ? " locked" : "")}>
      <SiteHeader page="replay" go={go} lang={lang} setLang={setLang} dark={dark} toggleDark={toggleDark} total={R.items.length} />
      <div className="rp-wrap">
        <section className="rp-hero">
          <div>
            <div className="rp-kicker"><i>Singapore FinTech Festival 2026</i> · 11/18–11/20 · 活動已結束</div>
            <h1 className="rp-h1">{R.items.length} 場演講，<br />每一場的結論與重點</h1>
            <p className="rp-sub">Festival、Policy、FutureMatters、Frontier 四個主舞台的官方回放，整理成繁體中文。每場先給一句話結論，再列出講者談到的重點。沒到現場，或想回頭複習某一場，從這裡開始讀。</p>
            <div className="rp-figs">
              <div className="rp-fig"><b>{R.items.length}</b><span>場回放重點</span></div>
              <div className="rp-fig"><b>{R.stages.length}</b><span>個主舞台</span></div>
              <div className="rp-fig"><b>{R.days.length}</b><span>天議程</span></div>
            </div>
            <div className="rp-actions">
              {first && <button className="btn btn-pri" onClick={() => open(first.sid)}>從第一場開始讀<Icon name="right" /></button>}
              <button className="btn btn-sec" onClick={() => listRef.current && listRef.current.scrollIntoView({ behavior: "smooth" })}>瀏覽全部場次</button>
            </div>
          </div>
          <ReplayMap R={R} match={match} onOpen={open} />
        </section>
      </div>

      <div className="rp-wrap" ref={listRef}>
        <div className="rp-body">
          <aside className="rp-side">
            <div className="rp-search">
              <Icon name="search" />
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="搜尋講題、講者、關鍵字" aria-label="搜尋回放" />
              {q && <button className="clr" onClick={() => setQ("")} aria-label="清除搜尋"><Icon name="x" size={14} /></button>}
            </div>
            <FilterGroup label="日期" opts={dayOpts} value={day} onPick={setDay} />
            <FilterGroup label="舞台" opts={stageOpts} value={stage} onPick={setStage} />
            <FilterGroup label="議題" cls="topic" opts={topicOpts} value={topic} onPick={setTopic} />
            {filtered && <button className="rp-reset" onClick={reset}>清除所有條件</button>}
          </aside>

          <main className="rp-main">
            <div className="rp-count">{filtered ? <>符合條件 <b>{list.length}</b> 場，共 {R.items.length} 場</> : <>共 <b>{R.items.length}</b> 場，依時間排序</>}</div>
            {groups.length === 0 && (
              <div className="rp-empty">
                沒有符合的場次，換個關鍵字或放寬篩選看看
                <div><button className="btn btn-sec" onClick={reset}>清除所有條件</button></div>
              </div>
            )}
            {groups.map(([dk, arr]) => (
              <section className="dgroup" key={dk}>
                <div className="dgroup-h"><h2>{dayLong(dk)}</h2><span>{arr.length} 場</span></div>
                {arr.map((it) => <ReplayItem key={it.sid} it={it} lang={lang} onOpen={open} />)}
              </section>
            ))}
          </main>
        </div>
        <footer className="rp-foot">
          內容依 Singapore FinTech Festival 2026 官方回放影片的英文自動字幕整理，僅供個人學習參考；講者原意以影片為準。
          完整的 {D.S.length} 場議程在<a href="#/agenda">完整議程</a>。
        </footer>
      </div>

      {cur && <Reader it={cur} list={seq} lang={lang} onClose={close} onGo={(sid) => go("#/r/" + sid, true)} />}
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "colorIntensity": "tinted",
  "hourHeight": 104,
  "colWidth": 150,
  "quarterLines": false,
  "compactMax": 20,
  "chatWidth": 420
}/*EDITMODE-END*/;
