<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda · Singapore FinTech Festival 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SFF 2026 Agenda — Apple Calendar inspired
   Light + dark themes via CSS custom properties.
   ============================================================ */

:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", "PingFang TC", "PingFang SC", "Noto Sans TC",
          "Microsoft JhengHei", system-ui, sans-serif;

  /* surfaces */
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --surface-hover: #f2f2f5;

  /* text */
  --text-strong: #1d1d1f;
  --text: #43434a;
  --text-soft: #86868b;
  --text-faint: #aeaeb2;

  /* lines */
  --separator: rgba(60, 60, 67, 0.10);
  --separator-strong: rgba(60, 60, 67, 0.18);
  --hairline: rgba(60, 60, 67, 0.07);

  /* interactive */
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.12);

  /* shape */
  --radius-chip: 7px;
  --radius-card: 16px;
  --radius-pill: 980px;

  /* layout (overridden inline by tweaks) */
  --gutter-w: 60px;
  --head-h: 56px;
  --shadow-pop: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.16);
  --shadow-chip: 0 6px 20px rgba(0,0,0,.14);

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-2: #161618;
  --surface-hover: #2a2a2c;

  --text-strong: #f5f5f7;
  --text: #d6d6da;
  --text-soft: #98989d;
  --text-faint: #6c6c70;

  --separator: rgba(120, 120, 128, 0.28);
  --separator-strong: rgba(120, 120, 128, 0.42);
  --hairline: rgba(120, 120, 128, 0.16);

  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.22);

  --shadow-pop: 0 1px 2px rgba(0,0,0,.3), 0 16px 48px rgba(0,0,0,.55);
  --shadow-chip: 0 8px 26px rgba(0,0,0,.5);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-strong);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
#root { height: 100%; }

/* ---------- 資料載入前的狀態畫面（載入中／空資料／讀不到 CSV）---------- */
.boot { max-width: 620px; margin: 0 auto; padding: 12vh 24px 48px; text-align: center; color: var(--text); }
.boot-h { font-size: 21px; font-weight: 600; letter-spacing: -.01em; color: var(--text-strong); margin: 0 0 6px; }
.boot-msg { font-size: 14px; color: var(--text-soft); margin: 0 0 22px; line-height: 1.6; }
.boot-msg span { font-size: 13px; }
.boot-body { font-size: 14px; line-height: 1.75; color: var(--text); text-align: left; margin: 14px 0; }
.boot-body a { color: var(--accent); }
.boot code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
  background: var(--surface-hover); border-radius: 5px; padding: 1px 5px; }
.boot-pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.7;
  text-align: left; background: var(--surface-hover); border: 1px solid var(--separator);
  border-radius: var(--radius-card); padding: 12px 14px; overflow-x: auto; white-space: pre; margin: 10px 0 18px; }
.boot-note { font-size: 12px; color: var(--text-soft); margin-top: 26px; word-break: break-word; }
.boot-drop { display: block; border: 1.5px dashed var(--separator-strong); border-radius: var(--radius-card);
  padding: 26px 18px; font-size: 13.5px; color: var(--text-soft); cursor: pointer; transition: .15s ease; }
.boot-drop:hover, .boot-drop.over { border-color: var(--accent); color: var(--text-strong);
  background: color-mix(in srgb, var(--accent) 7%, transparent); }
.boot-drop b { color: var(--accent); font-weight: 600; }
.boot-spin { width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
  border: 2.5px solid var(--separator); border-top-color: var(--accent); animation: boot-spin .8s linear infinite; }
@keyframes boot-spin { to { transform: rotate(360deg); } }

/* ---------- track colors ----------
   .tk-XX { --c: … } 由 agenda.csv 載入器在執行時注入（見 TRACK_CFG / PALETTE），
   所以 track 數量不受這裡的 class 數量限制。下面只是資料還沒到時的保險色。 */
[class*="tk-"] { --c: #8a8a8e; }

/* ============================================================
   App shell
   ============================================================ */
.app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--separator);
}
.brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
.brand .t1 {
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--text-strong);
}
.brand .t2 { font-size: 12px; color: var(--text-soft); letter-spacing: .01em; }

/* segmented control (Apple style) */
.seg {
  display: inline-flex; background: var(--surface-hover);
  border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  font: inherit; font-size: 13px; font-weight: 500;
  border: none; background: transparent; color: var(--text);
  padding: 5px 14px; border-radius: 7px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.seg button.on {
  background: var(--surface);
  color: var(--text-strong);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
}
[data-theme="dark"] .seg button.on { background: #48484a; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: none;
  background: var(--surface-hover); color: var(--text);
  cursor: pointer; font-size: 16px; display: grid; place-items: center;
  transition: background .15s;
}
.icon-btn:hover { background: var(--separator-strong); }

.reg-btn {
  font: inherit; font-size: 13px; font-weight: 600;
  background: var(--accent); color: #fff; text-decoration: none;
  padding: 7px 16px; border-radius: var(--radius-pill);
}

/* ---------- day selector ----------
   Deliberately compact: a single-line pill row, so the calendar below it
   gets the vertical space and the visual weight. The day's stage label
   lives in the button's title — the calendar's column headers already
   name the stages. */
.daybar {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 24px; background: var(--surface);
  border-bottom: 1px solid var(--separator);
  overflow-x: auto;
}
.day {
  flex: 0 0 auto;
  border: 1px solid var(--separator-strong); background: transparent;
  border-radius: var(--radius-pill); padding: 4px 13px; cursor: pointer;
  font: inherit; color: var(--text); transition: background .15s, border-color .15s;
  display: flex; align-items: baseline; gap: 6px;
}
.day:hover { background: var(--surface-hover); }
.day .dn { font-size: 11px; font-weight: 500; color: var(--text-soft); }
.day .dd {
  font-size: 13px; font-weight: 600; color: var(--text-strong);
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.day.on {
  background: var(--accent); border-color: var(--accent);
}
.day.on .dd { color: #fff; }
.day.on .dn { color: rgba(255,255,255,.82); }

/* ---------- legend ---------- */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px;
  padding: 6px 20px; background: var(--surface-2);
  border-bottom: 1px solid var(--separator);
  font-size: 12px; color: var(--text-soft);
}
.legend .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); display: inline-block; }
.legend .sep { margin-left: auto; }
/* 圖例同時就是篩選器：點主題或參加資格即可過濾，不另外佔一列 */
.legend .lg, .legend .mk {
  font: inherit; font-size: 12px; color: var(--text-soft);
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius-pill); padding: 3px 9px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, color .15s, opacity .15s;
}
.legend .lg:hover, .legend .mk:hover {
  background: var(--surface-hover); border-color: var(--separator-strong);
}
.legend .lg.on {
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
  border-color: var(--c); color: var(--text-strong); font-weight: 500;
}
.legend .mk.on {
  background: var(--surface-hover); border-color: var(--separator-strong);
  color: var(--text-strong); font-weight: 600;
}
/* 有篩選時，未選中的項目退到背景 */
.legend.filtering .lg:not(.on), .legend.filtering .mk:not(.on) { opacity: .4; }
.lg-clear {
  font: inherit; font-size: 11.5px; font-weight: 500;
  color: var(--accent); background: transparent;
  border: 1px solid var(--separator-strong); border-radius: var(--radius-pill);
  padding: 3px 10px; cursor: pointer; margin-left: 4px;
}
.lg-clear:hover { background: var(--surface-hover); }

/* ============================================================
   Calendar (grid) view
   ============================================================ */
.scroll { flex: 1; overflow: auto; background: var(--surface); position: relative; }

.cal { display: grid; position: relative; }

.corner {
  position: sticky; top: 0; left: 0; z-index: 45;
  height: var(--head-h); background: var(--surface);
  border-right: 1px solid var(--separator);
  border-bottom: 1px solid var(--separator-strong);
}
.colhead {
  position: sticky; top: 0; z-index: 30;
  height: var(--head-h); background: var(--surface);
  border-bottom: 1px solid var(--separator-strong);
  border-left: 1px solid var(--separator);
  padding: 8px 10px; display: flex; flex-direction: column; justify-content: center;
  gap: 1px; overflow: hidden;
}
.colhead .code { font-size: 13px; font-weight: 650; color: var(--text-strong); letter-spacing: -0.01em; }
.colhead .name {
  font-size: 11px; color: var(--text-soft); line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.gutter {
  position: sticky; left: 0; z-index: 20;
  background: var(--surface);
  border-right: 1px solid var(--separator);
}
.hourlabel {
  position: absolute; right: 8px;
  font-size: 11px; font-weight: 500; color: var(--text-soft);
  letter-spacing: 0.01em;
}

.colbody {
  position: relative;
  border-left: 1px solid var(--separator);
  background-repeat: repeat;
}

/* event chip */
.ev {
  position: absolute;
  height: var(--h);
  border-radius: var(--radius-chip);
  padding: 4px 7px 4px 8px;
  overflow: hidden; cursor: pointer;
  border-left: 3px solid var(--c);
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  color: var(--text-strong);
  box-shadow: 0 0 0 1px var(--surface);
  transition: box-shadow .14s ease, transform .14s ease;
  display: flex; flex-direction: column; gap: 1px;
}
.ev:hover {
  height: auto; min-height: var(--h);
  z-index: 60; box-shadow: var(--shadow-chip);
  transform: translateY(-1px);
}
.ev .etm {
  font-size: 10.5px; font-weight: 500; color: var(--text-soft);
  white-space: nowrap; line-height: 1.2;
}
.ev .ett {
  font-size: 12px; font-weight: 600; line-height: 1.28; letter-spacing: -0.005em;
  color: var(--text-strong);
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  -webkit-line-clamp: var(--lines, 2);
}
.ev:hover .ett { -webkit-line-clamp: unset; }
.ev .mk { position: absolute; top: 4px; right: 5px; font-size: 9.5px; opacity: .8; }

/* compact variant — short sessions collapse to a single line */
.ev.cmp {
  flex-direction: row; align-items: center; gap: 7px;
  padding: 0 8px 0 8px;
  background: color-mix(in srgb, var(--c) 9%, var(--surface));
}
.ev.cmp .etm { flex: 0 0 auto; }
.ev.cmp .ett {
  display: block; flex: 1 1 auto; min-width: 0;
  font-size: 11.5px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ev.cmp:hover {
  flex-direction: column; align-items: stretch; gap: 1px;
  padding: 4px 7px 4px 8px;
}
.ev.cmp:hover .ett { white-space: normal; }
.ev.cmp:hover .mk { position: static; font-size: 9px; opacity: .75; }

/* true-start tick for chips nudged off the axis */
.tick {
  position: absolute; left: -5px; width: 9px; height: 1px;
  background: var(--c); opacity: .6; pointer-events: none;
}
[data-ci="subtle"] .ev.cmp { background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
[data-ci="vivid"]  .ev.cmp { background: color-mix(in srgb, var(--c) 18%, var(--surface)); }

/* color intensity variants */
[data-ci="subtle"] .ev { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
[data-ci="vivid"]  .ev { background: color-mix(in srgb, var(--c) 24%, var(--surface)); }
[data-ci="vivid"]  .ev .ett { color: color-mix(in srgb, var(--c) 62%, var(--text-strong)); }
[data-ci="vivid"]  .ev .etm { color: color-mix(in srgb, var(--c) 45%, var(--text-soft)); }

.empty {
  padding: 70px 24px; text-align: center; color: var(--text-soft); font-size: 14px;
}

/* ============================================================
   List / Agenda view
   ============================================================ */
.list { flex: 1; overflow: auto; background: var(--bg); }
.list-inner { max-width: 860px; margin: 0 auto; padding: 18px 20px 80px; }

.hourgroup { margin-top: 10px; }
.hourgroup-h {
  position: sticky; top: 0; z-index: 5;
  font-size: 12px; font-weight: 600; color: var(--text-soft);
  letter-spacing: 0.04em; padding: 12px 4px 8px;
  background: linear-gradient(var(--bg) 70%, transparent);
}

.litem {
  display: grid; grid-template-columns: 78px 1fr; gap: 14px;
  background: var(--surface); border: 1px solid var(--separator);
  border-radius: 14px; padding: 13px 16px; margin-bottom: 8px;
  cursor: pointer; transition: border-color .14s, box-shadow .14s, transform .14s;
}
.litem:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-1px); }
[data-theme="dark"] .litem:hover { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.litem .ltime { display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--c); padding-left: 10px; }
.litem .ltime .s { font-size: 14px; font-weight: 600; color: var(--text-strong); }
.litem .ltime .e { font-size: 12px; color: var(--text-soft); }
.litem .ltime .dur { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }
.litem .lbody { min-width: 0; }
.litem .ltitle { font-size: 14.5px; font-weight: 600; line-height: 1.34; letter-spacing: -0.01em; color: var(--text-strong); }
.litem .lmeta { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--text-soft); }
.litem .lmeta .tk { display: inline-flex; align-items: center; gap: 5px; }
.litem .lmeta .tk .dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--c); }
.litem .lmeta .room { font-weight: 500; color: var(--text); }
.litem .lspk { margin-top: 6px; font-size: 12px; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================
   Modal (event detail popover)
   ============================================================ */
.ov {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.32); backdrop-filter: blur(6px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 7vh 16px 40px; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.ov.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 540px; background: var(--surface);
  border-radius: var(--radius-card); box-shadow: var(--shadow-pop);
  border-top: 4px solid var(--c);
  padding: 26px 26px 24px; position: relative;
  transform: translateY(10px) scale(.98); transition: transform .2s cubic-bezier(.2,.7,.2,1);
}
.ov.show .modal { transform: none; }
.modal-grab { display: none; }
.modal .x {
  position: absolute; top: 16px; right: 16px; width: 28px; height: 28px;
  border: none; border-radius: 50%; background: var(--surface-hover);
  color: var(--text-soft); font-size: 16px; cursor: pointer; display: grid; place-items: center;
}
.modal .x:hover { background: var(--separator-strong); color: var(--text-strong); }
.modal .mtrack { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--c); letter-spacing: .01em; }
.modal .mtrack .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.modal h2 { margin-top: 10px; font-size: 21px; font-weight: 650; line-height: 1.32; letter-spacing: -0.02em; color: var(--text-strong); padding-right: 30px; }
.modal .mrow { margin-top: 16px; display: flex; gap: 11px; align-items: flex-start; font-size: 14px; color: var(--text); }
.modal .mrow .mi { width: 18px; flex: 0 0 18px; text-align: center; color: var(--text-faint); font-size: 13px; margin-top: 1px; }
.modal .mrow b { color: var(--text-strong); font-weight: 600; }
.modal .badges { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.badge { font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: var(--radius-pill); border: 1px solid var(--separator-strong); color: var(--text); }
.badge.open { color: #2fa15a; border-color: rgba(47,161,90,.4); background: rgba(47,161,90,.08); }
.badge.invite { color: #db5793; border-color: rgba(219,87,147,.4); background: rgba(219,87,147,.08); }
.badge.premium { color: #c2952a; border-color: rgba(194,149,42,.45); background: rgba(194,149,42,.10); }
.modal .spk { margin-top: 18px; }
.modal .spk .lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 9px; }
.modal .spk .chips { display: flex; flex-wrap: wrap; gap: 7px; }
.modal .spk .chip { font-size: 12.5px; padding: 5px 11px; border-radius: var(--radius-pill); background: var(--surface-hover); color: var(--text); }
.modal .spk .chip.more { cursor: pointer; border: none; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--surface-hover); }
.modal .spk .chip.more:hover { background: var(--separator-strong); }
.modal .mdesc { margin-top: 18px; }
.modal .mdesc .lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 9px; }
.modal .mdesc p { font-size: 14px; line-height: 1.62; color: var(--text); margin: 0 0 10px; white-space: pre-line; }
.modal .mdesc p:last-child { margin-bottom: 0; }
.modal .mdesc em { font-style: italic; color: var(--text-strong); }
.litem .ldesc { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--text-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard .mc-desc { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--text-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; }
.lang-btn { font-size: 13px; font-weight: 700; }
.mlang { border: none; background: var(--separator); color: var(--text); border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; padding: 0 11px; height: 30px; cursor: pointer; }
.modal a.ext {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 20px;
  background: var(--accent); color: #fff; text-decoration: none;
  font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: var(--radius-pill);
}

/* scrollbars */
.scroll::-webkit-scrollbar, .list::-webkit-scrollbar { width: 11px; height: 11px; }
.scroll::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb {
  background: var(--separator-strong); border-radius: 6px; border: 3px solid var(--surface);
}
.daybar::-webkit-scrollbar { height: 0; }

@media (max-width: 640px) {
  .topbar, .daybar, .legend { padding-left: 14px; padding-right: 14px; }
  .brand .t1 { font-size: 15px; }
}

/* ============================================================
   Mobile — responsive single-column timeline (g0v-inspired)
   ============================================================ */
.mapp { display: flex; flex-direction: column; height: 100%; background: var(--bg); overflow: hidden; }
.mapp.framed {
  max-width: 430px; margin: 0 auto;
  border-left: 1px solid var(--separator-strong);
  border-right: 1px solid var(--separator-strong);
}

.mtopbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 11px) 16px 11px;
  background: var(--surface); border-bottom: 1px solid var(--separator);
}
.mbrand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; min-width: 0; }
.mbrand .mb1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-strong); }
.mbrand .mb2 {
  font-size: 11px; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.micon {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; border: none;
  background: var(--surface-hover); color: var(--text); font-size: 17px; cursor: pointer;
  display: grid; place-items: center;
}
.micon:active { background: var(--separator-strong); }

  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

  var rows = [], row = [], field = "", inQuotes = false, i = 0;
  while (i < text.length) {
    var c = text.charAt(i);
    if (inQuotes) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"')  { inQuotes = true; i++; continue; }
    if (c === ",")  { row.push(field); field = ""; i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* 表頭 + 資料列 -> 物件陣列 */
function toRecords(rows) {
  if (!rows.length) return [];
  var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  var out = [];
  for (var r = 1; r < rows.length; r++) {
    var cells = rows[r];
    if (cells.length === 1 && !cells[0].trim()) continue;   // 空行
    var o = {};
    for (var c = 0; c < head.length; c++) o[head[c]] = (cells[c] || "").trim();
    out.push(o);
  }
  return out;
}

/* ============================================================
   小工具
   ============================================================ */

/* "9:00 AM" / "1:30 PM" / "13:30" -> "9:00" / "13:30"（24 小時制）*/
function to24(s) {
  var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(s).trim());
  if (!m) return null;
  var h = parseInt(m[1], 10), ap = (m[3] || "").toUpperCase();
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h + ":" + m[2];
}

/* "Mon, 10 Nov | 9:00 AM - 10:30 AM" -> ["9:00", "10:30"] */
function parseTimes(datetime) {
  var tail = String(datetime).split("|").pop();
  var m = /(\d{1,2}:\d{2}\s*(?:AM|PM)?)\s*[-–—]\s*(\d{1,2}:\d{2}\s*(?:AM|PM)?)/i.exec(tail);
  if (m) {
    var a = to24(m[1]), b = to24(m[2]);
    if (a && b) return [a, b];
  }
  /* 只有開始時間 -> 預設 30 分鐘 */
  var one = /(\d{1,2}:\d{2}\s*(?:AM|PM)?)/i.exec(tail);
  if (one) {
    var s = to24(one[1]);
    if (s) {
      var p = s.split(":"), t = parseInt(p[0], 10) * 60 + parseInt(p[1], 10) + 30;
      return [s, Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")];
    }
  }
  return null;
}

/* 場次網址 -> 唯一識別（slug），用來當說明文字的 key。
   官網用過兩種網址格式，兩種都要吃得下：
     2026  https://…/agenda?session=AGND441-welcome-…   -> "AGND441-welcome-…"
     2025  https://…/agenda/agn90-trusted-data-…        -> "agn90-trusted-data-…"
   2026 的網址含 %3B、%22 等百分比編碼，所以要解碼後再當 key。 */
function slugOf(url) {
  var raw = String(url || "");
  if (!raw) return "";
  var q = /[?&]session=([^&#]+)/i.exec(raw);
  var slug = q ? q[1] : raw.split(/[?#]/)[0].replace(/\/+$/, "").split("/").pop();
  try { slug = decodeURIComponent(slug); } catch (e) { /* 編碼壞掉就用原字串 */ }
  return slug;
}

/* 由名稱推導代碼："Design Thinking Room" -> "DTR"、"Garnet 212" -> "G2" */
function initials(name) {
  var words = String(name).replace(/[^A-Za-z0-9一-鿿]+/g, " ").split(/\s+/).filter(Boolean);
  var code = words.slice(0, 3).map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
  return (code || "X").slice(0, 4);
}

function uniqueCode(base, used) {
  var code = base, n = 2;
  while (used[code]) code = base + (n++);
  used[code] = true;
  return code;
}

/* 由 ISO 日期或 "Mon, 10 Nov" 取出顯示用的日期資訊 */
function dayInfo(key, isoHint) {
  var iso = /^\d{4}-\d{2}-\d{2}$/.test(key) ? key : (isoHint || "");
  if (iso) {
    var p = iso.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return {
      iso:  iso,
      wd:   WD_EN[dt.getDay()],
      wdz:  WD_ZH[dt.getDay()],
      date: MON[+p[1] - 1] + " " + (+p[2]),
      md:   (+p[1]) + "/" + (+p[2])
    };
  }
  /* 沒有 ISO 欄位時，退回解析 "Mon, 10 Nov" */
  var m = /^\s*([A-Za-z]{3})[a-z]*,?\s*(\d{1,2})\s+([A-Za-z]{3})/.exec(key);
  if (m) {
    var mon = MONTHS[m[3].toLowerCase()] || 0;
    return {
      iso: "", wd: m[1],
      wdz: WD_ZH[WD_EN.indexOf(m[1])] || "",
      date: m[3] + " " + parseInt(m[2], 10),
      md: mon ? mon + "/" + parseInt(m[2], 10) : key
    };
  }
  return { iso: "", wd: "", wdz: "", date: key, md: key };
}

/* ============================================================
   CSV 記錄 -> window.SFF
   ============================================================ */
function build(records) {

  /* ---- 1. 場地欄位 -------------------------------------------------
     一般用 stage 當欄位；但若某個 stage 底下有多個不同 location
     （2025 的 Insights Forum、各年的 Side Programmes），就改用 location，
     這樣 lounge 與各會議室才會拆成獨立欄位。 */
  var locsByStage = {};
  records.forEach(function (r) {
    var m = locsByStage[r.stage] || (locsByStage[r.stage] = {});
    if (r.location) m[r.location] = true;
  });
  function venueName(r) {
    var multi = Object.keys(locsByStage[r.stage] || {}).length > 1;
    if (multi && r.location) return r.location;
    /* 官網有些場次還沒公布舞台與場地，集中到一欄而不是各自變成看不懂的代碼 */
    return r.stage || r.location || "TBC";
  }

  /* ---- 2. 場地代碼／標籤 ---- */
  var present = {};
  records.forEach(function (r) { present[venueName(r)] = true; });

  var venueOrder = Object.keys(VENUE_CFG).filter(function (n) { return present[n]; });
  Object.keys(present).sort().forEach(function (n) {
    if (!VENUE_CFG[n]) venueOrder.push(n);
  });

  var venueCode = {}, VENUES = [], VENUE_FULL = {}, usedVenue = {};
  venueOrder.forEach(function (name) {
    var cfg  = VENUE_CFG[name];
    var code = uniqueCode(cfg ? cfg[0] : initials(name), usedVenue);
    venueCode[name] = code;
    VENUES.push([code, cfg ? cfg[1] : name.split(",")[0].trim()]);
    VENUE_FULL[code] = cfg ? cfg[2] : name;
  });

  /* ---- 3. 主題 track ---- */
  var trackPresent = {};
  records.forEach(function (r) { trackPresent[r.track || "Others"] = true; });

  var trackOrder = Object.keys(TRACK_CFG).filter(function (n) { return trackPresent[n]; });
  Object.keys(trackPresent).sort().forEach(function (n) {
    if (!TRACK_CFG[n]) trackOrder.push(n);
  });

  var trackCode = {}, TOPICS = {}, COLORS = {}, usedTrack = {}, pi = 0;
  trackOrder.forEach(function (name) {
    var cfg  = TRACK_CFG[name];
    var code = uniqueCode(cfg ? cfg[0] : initials(name), usedTrack);
    trackCode[name] = code;
    TOPICS[code] = [cfg ? cfg[1] : name, name];
    COLORS[code] = cfg ? cfg[2] : (code === "OT" ? GREY : PALETTE[pi++ % PALETTE.length]);
  });
  if (!TOPICS.OT) { TOPICS.OT = ["其他", "Others"]; COLORS.OT = GREY; }

  /* ---- 4. 日期 ---- */
  var dayKeys = [], isoOf = {};
  records.forEach(function (r) {
    var key = r.date || r.day;
    if (!key) return;
    if (dayKeys.indexOf(key) === -1) dayKeys.push(key);
    if (r.date) isoOf[key] = r.date;
  });
  if (dayKeys.every(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); })) dayKeys.sort();

  var dayKeyOf = {};
  dayKeys.forEach(function (k, i) { dayKeyOf[k] = "d" + (i + 1); });

  /* ---- 5. 場次列 ---- */
  var S = [], DESC = {};
  records.forEach(function (r) {
    var key = r.date || r.day;
    if (!key || !r.title) return;
    var t = parseTimes(r.datetime);
    if (!t) return;

    var slug = slugOf(r.url);
    var access = ACCESS_MAP[String(r.event_type || "").trim().toLowerCase()] || "O";
    var speakers = String(r.speakers || "").split(";")
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    S.push([
      dayKeyOf[key],                       /* 0 day    */
      venueCode[venueName(r)],             /* 1 場地代碼 */
      t[0],                                /* 2 start  */
      t[1],                                /* 3 end    */
      access,                              /* 4 O/I/P  */
      trackCode[r.track || "Others"] || "OT", /* 5 topic */
      r.title,                             /* 6 title  */
      slug,                                /* 7 slug   */
      speakers,                            /* 8 講者   */
      r.stage || VENUE_FULL[venueCode[venueName(r)]] || "",  /* 9 舞台顯示名 */
      String(r.url || "")                  /* 10 官方場次頁面（直接用 CSV 的 url）*/
    ]);

    if (slug && (r.description || r.description_zh)) {
      DESC[slug] = [r.description || "", r.description_zh || ""];
    }
  });

  /* 同一天同欄位依開始時間排序，日曆與清單才不會亂跳 */
  var toMin = function (t) { var p = t.split(":"); return +p[0] * 60 + +p[1]; };
  S.sort(function (a, b) {
    if (a[0] !== b[0]) return a[0] < b[0] ? -1 : 1;
    return toMin(a[2]) - toMin(b[2]);
  });

  /* ---- 6. DAYS / DAYMETA（欄位與標籤都由當天實際資料推導）---- */
  var DAYS = [], DAYMETA = {};
  dayKeys.forEach(function (key) {
    var k = dayKeyOf[key];
    var rows = records.filter(function (r) { return (r.date || r.day) === key; });
    var stages = {};
    rows.forEach(function (r) { if (r.stage) stages[r.stage] = true; });
    var stageNames = Object.keys(stages);

    var codesHere = {};
    rows.forEach(function (r) { codesHere[venueCode[venueName(r)]] = true; });

    var info = dayInfo(key, isoOf[key]);
    DAYS.push({ k: k, cols: VENUES.filter(function (v) { return codesHere[v[0]]; }) });
    DAYMETA[k] = {
      wd: info.wd, wdz: info.wdz, date: info.date, md: info.md, iso: info.iso,
      label: stageNames.length === 1 ? stageNames[0] : "Main Stages"
    };
  });

  return { VENUES: VENUES, VENUE_FULL: VENUE_FULL, TOPICS: TOPICS, COLORS: COLORS,
           U: OFFICIAL, S: S, DAYS: DAYS, DAYMETA: DAYMETA, DESC: DESC };
}

/* 主題配色以 <style> 注入，因此 track 數量不受既有 CSS class 限制 */
function injectTrackColors(colors) {
  var css = Object.keys(colors).map(function (c) {
    return ".tk-" + c + "{--c:" + colors[c] + ";}";
  }).join("\n");
  var el = document.createElement("style");
  el.id = "sff-track-colors";
  el.textContent = css;
  document.head.appendChild(el);
}

/* ============================================================
   狀態畫面（載入中／空資料／讀不到檔案）
   ============================================================ */
function paint(html) {
  var root = document.getElementById("root");
  if (root) root.innerHTML = '<div class="boot">' + html + "</div>";
}

function showLoading() {
  paint('<div class="boot-spin"></div><p class="boot-msg">載入議程資料…<br><span>Loading agenda…</span></p>');
}

function showEmpty() {
  paint(
    '<h1 class="boot-h">尚未匯入議程資料</h1>' +
    '<p class="boot-msg">No agenda data yet</p>' +
    '<p class="boot-body"><code>agenda.csv</code> 目前是空的。執行下列指令抓取 Singapore FinTech Festival 2026 的議程：</p>' +
    '<pre class="boot-pre">python3 -m pip install -r requirements.txt\npython3 scrape_sff_agenda.py</pre>' +
    '<p class="boot-body">抓完後重新整理本頁即可。</p>' +
    '<p class="boot-body"><a href="archive/2025/">→ 2025 年議程存檔</a></p>'
  );
}

function showFileFallback(reason) {
  paint(
    '<h1 class="boot-h">需要透過伺服器開啟</h1>' +
    '<p class="boot-msg">Load <code>agenda.csv</code> to continue</p>' +
    '<p class="boot-body">瀏覽器不允許 <code>file://</code> 頁面讀取旁邊的 CSV（CORS 限制），' +
    '所以直接雙擊開啟時讀不到 <code>agenda.csv</code>。兩種解法：</p>' +
    '<p class="boot-body"><b>1. 起一個本機伺服器</b>（推薦，功能完全正常）：</p>' +
    '<pre class="boot-pre">python3 -m http.server 8000\n# 然後開 http://localhost:8000/</pre>' +
    '<p class="boot-body"><b>2. 直接把 <code>agenda.csv</code> 拖進來</b>，或點下面的按鈕選檔：</p>' +
    '<label class="boot-drop" id="sff-drop">' +
    '  <input type="file" accept=".csv,text/csv" id="sff-file" hidden>' +
    '  <span>拖放 agenda.csv 到這裡，或<b>點此選擇檔案</b></span>' +
    '</label>' +
    '<p class="boot-note">' + reason + "</p>"
  );

  var drop = document.getElementById("sff-drop");
  var input = document.getElementById("sff-file");

  function readFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { showLoading(); start(String(fr.result)); };
    fr.onerror = function () { paint('<p class="boot-msg">讀取檔案失敗，請再試一次。</p>'); };
    fr.readAsText(file, "utf-8");
  }

  input.addEventListener("change", function () { readFile(input.files[0]); });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });
}

/* ============================================================
   啟動
   ============================================================ */
function start(text) {
  var data;
  try {
    data = build(toRecords(parseCSV(text)));
  } catch (err) {
    paint('<h1 class="boot-h">議程資料解析失敗</h1><p class="boot-body">' +
          'agenda.csv 的格式看起來不對。<br><code>' + String(err && err.message || err) + "</code></p>");
    return;
  }

  if (!data.S.length) { showEmpty(); return; }

  window.SFF = {
    VENUES: data.VENUES, VENUE_FULL: data.VENUE_FULL,
    TOPICS: data.TOPICS, U: data.U, S: data.S,
    DAYS: data.DAYS, DAYMETA: data.DAYMETA
  };
  window.SFF_DESC = data.DESC;

  injectTrackColors(data.COLORS);

  /* 介面那支 script 是 text/babel，轉譯完成的時間點不一定比 fetch 早，
     所以兩邊互相握手，誰後到誰負責 mount。 */
  window.__sffDataReady = true;
  if (typeof window.__sffMount === "function") window.__sffMount();
}

showLoading();

fetch(CSV_URL, { cache: "no-cache" })
  .then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
    return res.text();
  })
  .then(start)
  .catch(function (err) {
    showFileFallback("讀取 " + CSV_URL + " 失敗：" + String(err && err.message || err));
  });

})();
</script>

    0 2px 6px rgba(0,0,0,.15)}

    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}

  .twk-chip>span>i:first-child{box-shadow:none}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">
/* ============================================================
   SFF 2026 Agenda — React app (Apple Calendar inspired)

   資料由上方的載入器從 agenda.csv 組出來，是非同步的，所以 D / DESC 這裡
   先留空，等資料就緒再由 initData() 填入（見檔案最後的 mount 交接）。
   ============================================================ */
const { useState, useEffect, useMemo, useRef } = React;
let D = {}, DESC = {}, DAYMETA = {}, COLS_ALL = [];
function initData() {
  D = window.SFF || {};
  DESC = window.SFF_DESC || {};
  DAYMETA = D.DAYMETA || {};
  COLS_ALL = D.VENUES || [];
}

/* ---- language (description EN/ZH), persisted in localStorage ---- */
function useLang() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("sff-lang") || "en"; } catch (e) { return "en"; }
  });
  const set = (v) => { setLang(v); try { localStorage.setItem("sff-lang", v); } catch (e) {} };
  return [lang, set];
}
/* description text for a slug in the chosen language (falls back to English) */
const descText = (slug, lang) => {
  const d = DESC[slug];
  if (!d) return "";
  return (lang === "zh" ? d[1] : d[0]) || d[0] || "";
};
/* split a paragraph on _emphasis_ markers into React nodes */
const renderEmphasis = (text) =>
  text.split(/_([^_\n]+)_/).map((seg, i) => (i % 2 === 1 ? <em key={i}>{seg}</em> : seg));

/* ---- day metadata（wd / wdz / date / md / label 由載入器依 CSV 日期推導）---- */
const ACCESS = {
  O: { en: "Open", zh: "開放參加", cls: "open", mk: "" },
  I: { en: "Invite-Only", zh: "邀請制", cls: "invite", mk: "🔒" },
  P: { en: "Premium", zh: "付費", cls: "premium", mk: "◆" },
};
/* CSV 若出現沒見過的 event_type，也不該讓整個畫面炸掉 */
const accOf = (code) => ACCESS[code] || ACCESS.O;

/* 篩選用的 Set 切換：回傳新的 Set，不就地修改 */
const toggleIn = (set, key) => {
  const n = new Set(set);
  n.has(key) ? n.delete(key) : n.add(key);
  return n;
};

/* 議程篩選：主題 + 參加資格（🔒 邀請制 / ◆ 付費）。
   兩組條件是 AND，組內是 OR；空的 Set 代表不篩選。 */
const applyFilters = (arr, topics, access) => {
  if (topics.size) arr = arr.filter((s) => topics.has(s[5]));
  if (access.size) arr = arr.filter((s) => access.has(s[4]));
  return arr;
};

/* 桌機圖例 / 手機篩選面板共用的參加資格選項。
   只列出 CSV 裡真的出現過的代碼 — 否則會冒出永遠篩不到東西的按鈕
   （例如 2026 的資料完全沒有邀請制場次）。 */
const ACCESS_FILTERS = [["I", "Invite-Only", "邀請制"], ["P", "Premium", "付費"]];
const accessOptions = () => {
  const present = new Set(D.S.map((s) => s[4]));
  return ACCESS_FILTERS.filter(([k]) => present.has(k));
};
const dayMeta = (k) => DAYMETA[k] || { wd: "", wdz: "", date: k, md: k, label: "" };

/* ---- helpers ---- */
const mins = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const pad2 = (n) => String(n).padStart(2, "0");
const clock = (t) => { const [h, m] = t.split(":"); return pad2(+h) + ":" + m; };
const fmtMin = (m) => pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
const durLabel = (a, b) => {
  const d = mins(b) - mins(a);
  if (d >= 60) { const h = Math.floor(d / 60), mm = d % 60; return h + "h" + (mm ? " " + mm + "m" : ""); }
  return d + "m";
};
/* 每一天的欄位就是那天實際有場次的場地（載入器已按設定順序排好）*/
const colsOf = (day) => (day && day.cols) || [];
const fullName = (code) => (D.VENUE_FULL && D.VENUE_FULL[code]) || code;

/* 泛詞：不參與標題/說明評分（仍可參與主題/同義詞比對），避免泛查淹沒 */
const BOT_STOP = new Set(["finance", "financial", "session", "sessions", "singapore", "fintech",
  "future", "digital", "global", "world", "the", "and", "for", "with", "金融", "未來", "場次", "活動"]);

/* CJK 偵測（用於片語子字串比對） */
const HAS_CJK = (s) => /[㐀-鿿]/.test(s);

/* 拆解查詢：raw 全字串 + latin 英數 token 陣列 */
const botTokens = (q) => {
  const raw = (q || "").toLowerCase().trim();
  const latin = raw.split(/[^a-z0-9]+/i).filter((t) => t.length >= 2);
  return { raw, latin };
};

/* 推斷主題：回傳 Map<code, 命中觸發詞數> */
const botTopicHits = (qInfo) => {
  const { raw, latin } = qInfo;
  const latinSet = new Set(latin);
  const hits = new Map();
  for (const code in BOT_SYN) {
    let n = 0;
    for (const trig of BOT_SYN[code]) {
      const isShortLatin = trig.length <= 3 && /^[a-z0-9.]+$/.test(trig);
      const hit = isShortLatin ? latinSet.has(trig) : raw.includes(trig);
      if (hit) n++;
    }
    if (n > 0) hits.set(code, n);
  }
  return hits;
};

/* 對單一場次評分 */
const scoreSession = (s, qInfo) => {
  const { raw, latin, topicHits } = qInfo;
  const code = s[5];
  let score = 0;

  // 主題命中（最高權重）
  if (topicHits.has(code)) score += 50 + 5 * topicHits.get(code);

  // 主題標籤字面（中/英）
  const tp = D.TOPICS[code];
  if (tp) {
    const labelZh = tp[0].toLowerCase(), labelEn = tp[1].toLowerCase();
    if (latin.some((t) => labelEn.includes(t)) || (HAS_CJK(raw) && (labelZh.includes(raw) || raw.includes(labelZh))))
      score += 20;
  }

  // 標題關鍵字（英文 token，去泛詞）
  const title = (s[6] || "").toLowerCase();
  let titleHits = 0;
  for (const t of new Set(latin)) {
    if (t.length >= 3 && !BOT_STOP.has(t) && title.includes(t)) titleHits++;
  }
  score += Math.min(36, titleHits * 12);
  // 標題 CJK 片語
  if (HAS_CJK(raw) && !BOT_STOP.has(raw) && title.includes(raw)) score += 12;

  // 說明關鍵字（兩語都查）
  const desc = ((descText(s[7], "en") || "") + "\n" + (descText(s[7], "zh") || "")).toLowerCase();
  if (desc) {
    let descHits = 0;
    for (const t of new Set(latin)) {
      if (t.length >= 3 && !BOT_STOP.has(t) && desc.includes(t)) descHits++;
    }
    score += Math.min(20, descHits * 5);
    if (HAS_CJK(raw) && !BOT_STOP.has(raw) && desc.includes(raw)) score += 5;
  }

  // 講者
  const spk = (s[8] || []).join(" · ").toLowerCase();
  if (spk) {
    let spkHits = 0;
    for (const t of new Set(latin)) {
      if (t.length >= 3 && spk.includes(t)) spkHits++;
    }
    if (HAS_CJK(raw) && spk.includes(raw)) spkHits++;
    score += Math.min(24, spkHits * 8);
  }

  // Open 場次微調（僅在已有內容匹配時，避免無關場次靠此上榜）
  if (score > 0 && s[4] === "O") score += 1;

  return score;
};

/* 推薦：對全部 5 天場次評分，回傳前 N 名 */
const recommend = (query, N = 6) => {
  const base = botTokens(query);
  if (!base.raw) return { items: [], topicHits: [] };
  const topicHits = botTopicHits(base);
  const qInfo = { ...base, topicHits };
  const scored = [];
  for (const s of D.S) {
    const sc = scoreSession(s, qInfo);
    if (sc > 0) scored.push({ s, sc });
  }
  scored.sort((a, b) => b.sc - a.sc || mins(a.s[2]) - mins(b.s[2]) || a.s[0].localeCompare(b.s[0]));
  return { items: scored.slice(0, N).map((x) => x.s), topicHits: [...topicHits.keys()] };
};

/* assign overlap lanes within a column */
function computeLanes(evs) {
  const sorted = [...evs].sort((a, b) => mins(a[2]) - mins(b[2]) || mins(a[3]) - mins(b[3]));
  const laneEnd = []; const laneOf = new Map();
  sorted.forEach((ev) => {
    let p = laneEnd.findIndex((end) => mins(ev[2]) >= end);
    if (p < 0) { p = laneEnd.length; laneEnd.push(0); }
    laneEnd[p] = mins(ev[3]); laneOf.set(ev, p);
  });
  return { laneOf, count: Math.max(1, laneEnd.length) };
}

/* ============================================================ */
function EventChip({ s, lane, lanes, top, h, compact, onSelect }) {
  const lines = Math.max(1, Math.min(6, Math.floor((h - 16) / 15)));
  const mk = accOf(s[4]).mk;
  return (
    <div
      className={"ev tk-" + s[5] + (compact ? " cmp" : "")}
      style={{
        top: top + "px",
        left: `calc(${(lane / lanes) * 100}% + 2px)`,
        width: `calc(${100 / lanes}% - 4px)`,
        "--h": h + "px",
        "--lines": lines,
      }}
      onClick={() => onSelect(s)}
    >
      {mk && !compact && <span className="mk">{mk}</span>}
      <span className="etm">{compact && mk ? mk + " " + clock(s[2]) : clock(s[2])}</span>
      <span className="ett">{s[6]}</span>
    </div>
  );
}

/* 1c layout: short sessions become single-line chips, and every chip is nudged
   down so it never covers the one after it. A tick marks the true start time. */
function layoutColumn(evs, laneOf, dayStart, pxPerMin, minH, compactMax) {
  const CMP_H = 22, GAP = 3;
  const out = []; const ticks = []; const prevBottom = new Map();
  [...evs].sort((a, b) => mins(a[2]) - mins(b[2]) || mins(a[3]) - mins(b[3])).forEach((s) => {
    const lane = laneOf.get(s) || 0;
    const exact = (mins(s[2]) - dayStart) * pxPerMin;
    const dur = mins(s[3]) - mins(s[2]);
    const compact = compactMax > 0 && dur <= compactMax;
    const h = compact ? CMP_H : Math.max(minH, dur * pxPerMin);
    const floor = prevBottom.has(lane) ? prevBottom.get(lane) + GAP : -Infinity;
    const top = Math.max(exact, floor);
    prevBottom.set(lane, top + h);
    if (top - exact > 0.5) ticks.push({ id: s[7], top: exact, track: s[5] });
    out.push({ s, lane, top, h, compact });
  });
  return { placed: out, ticks, bottom: Math.max(0, ...out.map((p) => p.top + p.h)) };
}

function CalendarView({ day, sessions, hourHeight, colWidth, quarterLines, compactMax, onSelect }) {
  const pxPerMin = hourHeight / 60;
  const minH = Math.max(28, hourHeight * 0.3);

  const master = colsOf(day);
  const used = master.filter(([k]) => sessions.some((s) => s[1] === k));
  if (!used.length) return <div className="empty">尚無可顯示的場次。</div>;

  const dayStart = Math.floor(Math.min(...sessions.map((s) => mins(s[2]))) / 60) * 60;
  const dayEnd = Math.ceil(Math.max(...sessions.map((s) => mins(s[3]))) / 60) * 60;
  const totalMin = dayEnd - dayStart;
  const bodyH = totalMin * pxPerMin;

  const laneData = {}; const layout = {};
  used.forEach(([k]) => {
    const evs = sessions.filter((s) => s[1] === k);
    laneData[k] = computeLanes(evs);
    layout[k] = layoutColumn(evs, laneData[k].laneOf, dayStart, pxPerMin, minH, compactMax);
  });
  const gridH = Math.max(bodyH, ...used.map(([k]) => layout[k].bottom + 4));

  const hours = [];
  for (let m = dayStart; m <= dayEnd; m += 60) hours.push(m);

  const bg = (() => {
    const layers = [`linear-gradient(var(--separator) 1px, transparent 1px)`];
    const sizes = [`100% ${60 * pxPerMin}px`];
    if (quarterLines) { layers.push(`linear-gradient(var(--hairline) 1px, transparent 1px)`); sizes.push(`100% ${15 * pxPerMin}px`); }
    return { backgroundImage: layers.join(","), backgroundSize: sizes.join(",") };
  })();

  const n = used.length;
  const tpl = `var(--gutter-w) repeat(${n}, minmax(${colWidth}px, 1fr))`;

  return (
    <div className="scroll">
      <div className="cal" style={{ gridTemplateColumns: tpl }}>
        <div className="corner" style={{ gridColumn: 1, gridRow: 1 }} />
        {used.map(([k, name], i) => (
          <div className="colhead" key={"h" + k} style={{ gridColumn: i + 2, gridRow: 1 }}>
            <span className="code">{k}</span>
            <span className="name" title={name}>{name}</span>
          </div>
        ))}
        <div className="gutter" style={{ gridColumn: 1, gridRow: 2, height: gridH + "px" }}>
          {hours.map((m, i) => (
            <span className="hourlabel" key={m}
              style={{ top: (m - dayStart) * pxPerMin + "px", transform: i === 0 ? "translateY(2px)" : "translateY(-50%)" }}>
              {fmtMin(m)}
            </span>
          ))}
        </div>
        {used.map(([k], i) => {
          const { count } = laneData[k];
          const { placed, ticks } = layout[k];
          return (
            <div className="colbody" key={"b" + k} style={{ gridColumn: i + 2, gridRow: 2, height: gridH + "px", ...bg }}>
              {ticks.map((t) => (
                <div className={"tick tk-" + t.track} key={"t" + t.id} style={{ top: t.top + "px" }} />
              ))}
              {placed.map((p) => (
                <EventChip key={p.s[7]} s={p.s} lane={p.lane} lanes={count}
                  top={p.top} h={p.h} compact={p.compact} onSelect={onSelect} />
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    return () => document.removeEventListener("keydown", k);
  }, [onClose]);

}

/* ============================================================
   Mobile — responsive single-column timeline (g0v-inspired)
   ============================================================ */
function useMediaQuery(q) {
  const [m, setM] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const mq = window.matchMedia(q);
    const fn = (e) => setM(e.matches);
    mq.addEventListener("change", fn);
    return () => mq.removeEventListener("change", fn);
  }, [q]);
  return m;
}

/* Swipe-down-to-dismiss for bottom sheets (filter sheet + mobile detail card).
   The drag only starts when the sheet content is scrolled to the top, so it
   never fights with normal scrolling. Release past the threshold (or with a
   quick flick) calls onClose; otherwise it snaps back. */
function useSwipeDismiss(onClose) {
  const ref = React.useRef(null);     // the scrollable sheet element
  const st = React.useRef(null);      // live drag state { y, t, d }
  const [dy, setDy] = useState(0);
  const [dragging, setDragging] = useState(false);

  const onTouchStart = (e) => {
    const el = ref.current;
    if (el && el.scrollTop > 0) { st.current = null; return; }
    st.current = { y: e.touches[0].clientY, t: Date.now(), d: 0 };
    setDragging(true);
  };
  const onTouchMove = (e) => {
    const s = st.current; if (!s) return;
    const el = ref.current;
    if (el && el.scrollTop > 0) { st.current = null; setDy(0); setDragging(false); return; }
    const delta = e.touches[0].clientY - s.y;
    if (delta <= 0) { s.d = 0; setDy(0); return; }
    s.d = delta; setDy(delta);
  };
  const onTouchEnd = () => {
    const s = st.current; if (!s) return;
    const delta = s.d, dt = Date.now() - s.t;
    st.current = null; setDragging(false); setDy(0);
    if (delta > 110 || (delta > 40 && dt < 240)) onClose();
  };

  const style = dragging ? { transform: "translateY(" + dy + "px)", transition: "none" } : undefined;
  return { ref, style, handlers: { onTouchStart, onTouchMove, onTouchEnd } };
}

  const list = useMemo(() => {
    let arr = applyFilters(sessions, topics, access);
    if (rooms.size) arr = arr.filter((s) => rooms.has(s[1]));
    const q = search.trim().toLowerCase();
    if (q) arr = arr.filter((s) =>
      s[6].toLowerCase().includes(q) ||
      shortRoom(s[1]).toLowerCase().includes(q) ||
      (s[8] || []).some((p) => p.toLowerCase().includes(q)));
    return [...arr].sort((a, b) => mins(a[2]) - mins(b[2]) || mins(a[3]) - mins(b[3]) || a[1].localeCompare(b[1]));
  }, [sessions, search, topics, rooms, access]);

  if (!list.length)
    return <div className="mempty">沒有符合條件的場次<br /><span>試著調整篩選或搜尋關鍵字</span></div>;

  const groups = [];
  let cur = null;
  list.forEach((s) => {
    const hr = Math.floor(mins(s[2]) / 60);
    if (!cur || cur.hr !== hr) { cur = { hr, items: [] }; groups.push(cur); }
    cur.items.push(s);
  });

  return (
    <div className="mlist">
      {groups.map((g) => (
        <section className="mgroup" key={g.hr}>
          <div className="mgroup-h">
            <span className="mh-time">{pad2(g.hr)}:00</span>
            <span className="mh-line" />
            <span className="mh-cnt">{g.items.length} 場</span>
          </div>
          {g.items.map((s) => {
            const tp = D.TOPICS[s[5]];
            const acc = accOf(s[4]);
            return (
              <button className={"mcard tk-" + s[5]} key={s[7]} onClick={() => onSelect(s)}>
                <div className="mc-top">
                  <span className="mc-time">{clock(s[2])}–{clock(s[3])}</span>
                  <span className="mc-dur">{durLabel(s[2], s[3])}</span>
                  {acc.mk && <span className="mc-mk">{acc.mk}</span>}
                </div>
                <div className="mc-title">{s[6]}</div>
                <div className="mc-meta">
                  <span className="mc-topic"><span className="dot" />{tp[lang === "zh" ? 0 : 1]}</span>
                  <span className="mc-room" title={fullName(s[1])}>{s[1]} · {shortRoom(s[1])}</span>
                </div>
                {descText(s[7], lang) && (
                  <div className="mc-desc">{descText(s[7], lang)}</div>
                )}
              </button>
            );
          })}
        </section>
      ))}
    </div>
  );
}

function MobileFilterSheet({ open, onClose, topicList, roomList, accessList, topics, rooms, access, setTopics, setRooms, setAccess, lang }) {
  const toggle = (set, key, setter) => setter(toggleIn(set, key));
  const drag = useSwipeDismiss(onClose);
  return (
    <div className={"msheet-ov" + (open ? " show" : "")}
      onClick={(e) => { if (e.target.classList.contains("msheet-ov")) onClose(); }}>
      <div className="msheet" ref={drag.ref} style={drag.style} {...drag.handlers}>
        <div className="msheet-grab" />
        <div className="msheet-head">
          <span>篩選議程</span>
          <button className="msheet-clear" onClick={() => { setTopics(new Set()); setRooms(new Set()); setAccess(new Set()); }}>清除全部</button>
        </div>
        <div className="msheet-sec">
          <div className="msheet-lab">主題 Topic</div>
          <div className="msheet-chips">
            {topicList.map(([k, v]) => (
              <button key={k} className={"fchip tk-" + k + (topics.has(k) ? " on" : "")}
                onClick={() => toggle(topics, k, setTopics)}>
                <span className="dot" />{v[lang === "zh" ? 0 : 1]}
              </button>
            ))}
          </div>
        </div>
        {accessList.length > 0 && (
          <div className="msheet-sec">
            <div className="msheet-lab">參加資格 Access</div>
            <div className="msheet-chips">
              {accessList.map(([k, en, zh]) => (
                <button key={k} className={"fchip rchip" + (access.has(k) ? " on" : "")}
                  onClick={() => toggle(access, k, setAccess)}>
                  {accOf(k).mk} {lang === "zh" ? zh : en}
                </button>
              ))}
            </div>
          </div>
        )}
        <div className="msheet-sec">
          <div className="msheet-lab">場地 Room / Stage</div>
          <div className="msheet-chips">
            {roomList.map(([k, name]) => (
              <button key={k} className={"fchip rchip" + (rooms.has(k) ? " on" : "")}
                onClick={() => toggle(rooms, k, setRooms)}>
                <b>{k}</b> {name.split(" ‧ ")[0]}
              </button>
            ))}
          </div>
        </div>
        <button className="msheet-done" onClick={onClose}>完成</button>
      </div>
    </div>
  );
}

function MobileShell({ framed, t, setTweak, cur, setCur, sel, setSel, search, setSearch, topics, setTopics, rooms, setRooms, access, setAccess, filterOpen, setFilterOpen, botOpen, setBotOpen, lang, setLang }) {
  const day = D.DAYS.find((d) => d.k === cur);
  const sessions = useMemo(() => D.S.filter((s) => s[0] === cur), [cur]);
  const activeCount = topics.size + rooms.size + access.size + (search.trim() ? 1 : 0);
  const topicList = Object.entries(D.TOPICS);
  const roomList = colsOf(day).filter(([k]) => sessions.some((s) => s[1] === k));
  const accessList = useMemo(accessOptions, []);

  return (
    <div className={"mapp" + (framed ? " framed" : "")}>
      <header className="mtopbar">
        <div className="mbrand">
          <span className="mb1">SFF 2026 議程</span>
          <span className="mb2">Singapore FinTech Festival · 18–20 Nov</span>
        </div>
        <div className="mtop-actions">
          <button className="mlang" title="說明語言 / Description language"
            onClick={() => setLang(lang === "zh" ? "en" : "zh")}>{lang === "zh" ? "EN" : "中"}</button>
          <button className="micon" title="深色 / 淺色" onClick={() => setTweak("dark", !t.dark)}>{t.dark ? "☀" : "☾"}</button>
        </div>
      </header>

      <div className="mdaystrip">
        {D.DAYS.map((d) => {
          const m = dayMeta(d.k);
          return (
            <button key={d.k} className={"mday" + (d.k === cur ? " on" : "")} onClick={() => setCur(d.k)}>
              <span className="md-wd">{m.wdz}</span>
              <span className="md-dt">{m.md}</span>
            </button>
          );
        })}
      </div>

      <div className="mfilterbar">
        <div className="msearch">
          <span className="msearch-i">⌕</span>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="搜尋講題、講者…" />
          {search && <button className="msearch-x" onClick={() => setSearch("")}>×</button>}
        </div>
        <button className={"mfbtn" + (activeCount ? " on" : "")} onClick={() => setFilterOpen(true)}>
          篩選{activeCount ? " · " + activeCount : ""}
        </button>
      </div>

      <MobileView sessions={sessions} search={search} topics={topics} rooms={rooms} access={access} onSelect={setSel} lang={lang} />

      {sel && <Modal s={sel} onClose={() => setSel(null)} lang={lang} />}
      <MobileFilterSheet open={filterOpen} onClose={() => setFilterOpen(false)}
        topicList={topicList} roomList={roomList} accessList={accessList}
        topics={topics} rooms={rooms} access={access}
        setTopics={setTopics} setRooms={setRooms} setAccess={setAccess} lang={lang} />

      <TweaksPanel>
        <TweakSection label="外觀 Appearance" />
        <TweakToggle label="深色模式 Dark" value={t.dark} onChange={(v) => setTweak("dark", v)} />
      </TweaksPanel>

      {!botOpen && <BotLauncher lang={lang} onClick={() => setBotOpen(true)} />}
      <ChatBot open={botOpen} mobile={true} lang={lang}
        onClose={() => setBotOpen(false)} onSelect={setSel} />
    </div>
  );
}
