   小幫手 Bot — UI 元件
   ============================================================ */

/* 精簡推薦卡（沿用 .litem/.mcard 視覺，點擊呼叫共用 onSelect=setSel） */
function BotCard({ s, lang, onSelect }) {
  const tp = D.TOPICS[s[5]] || ["", ""];
  const acc = accOf(s[4]);
  const dm = dayMeta(s[0]);
  const desc = descText(s[7], lang);
  return (
    <button className={"bot-card tk-" + s[5]} onClick={() => onSelect(s)}>
      <div className="bc-title">{acc.mk ? acc.mk + " " : ""}{s[6]}</div>
      <div className="bc-meta">
        <span className="bc-tk"><span className="dot" />{tp[lang === "zh" ? 0 : 1]}</span>
        <span className="bc-when">{(lang === "zh" ? dm.md + " " + dm.wdz : (dm.wd + " " + dm.date))} · {clock(s[2])}–{clock(s[3])}</span>
        <span className="bc-room">{shortRoom(s[1])}</span>
      </div>
      {desc && <div className="bc-desc">{desc}</div>}
    </button>
  );
}

/* 浮動圓鈕 */
function BotLauncher({ onClick, lang }) {
  const T = BOT_T[lang] || BOT_T.en;
  return (
    <button className="bot-fab" title={T.launch} aria-label={T.launch} onClick={onClick}>
      <Icon name="chat" size={22} />
    </button>
  );
}

/* 聊天面板（桌機固定卡片 / 手機 bottom-sheet）。常駐掛載，用 open 控制顯示。 */
function ChatBot({ open, mobile, docked, width, lang, onClose, onSelect }) {
  const [messages, setMessages] = useState([]);
  const [query, setQuery] = useState("");
  const [busy, setBusy] = useState(false);          // 正在等 agent 回答
  const [aiOk, setAiOk] = useState(null);           // null = 還沒探測過
  const [mode, setMode] = useState(() => (lsGet(MODE_LS) === "ai" ? "ai" : "kw"));
  const logRef = useRef(null);
  const inputRef = useRef(null);
  const threadRef = useRef(null);
  const drag = useSwipeDismiss(onClose);
  const endpoint = agentEndpoint();
  const thread = () => threadRef.current || (threadRef.current = agentThread(false));

  // 首次開啟 → 問候
  useEffect(() => {
    if (open && messages.length === 0) {
      setMessages([{ role: "bot", kind: "greet" }]);
    }
    if (open && inputRef.current) {
      setTimeout(() => { try { inputRef.current.focus(); } catch (e) {} }, 60);
    }
  }, [open]);

  // 首次開啟時探一下 agent 在不在；在的話（且使用者沒特別選過關鍵字）就預設用 AI。
  useEffect(() => {
    if (!open || !endpoint || aiOk !== null) return;
    let alive = true;
    agentHealth(endpoint).then((ok) => {
      if (!alive) return;
      setAiOk(ok);
      if (ok && lsGet(MODE_LS) !== "kw") setMode("ai");
    });
    return () => { alive = false; };
  }, [open, endpoint, aiOk]);

  // 新訊息 → 捲到底
  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [messages, open]);

  const aiReady = !!endpoint && aiOk !== false;
  const aiMode = mode === "ai" && aiReady;

  const keywordAnswer = (q) => {
    const { items, topicHits } = recommend(q);
    return items.length
      ? { role: "bot", kind: "result", items, topicHits }
      : { role: "bot", kind: "nomatch" };
  };

  const send = () => {
    const q = query.trim();
    if (busy) return;
    if (!q) {
      setMessages((m) => [...m, { role: "bot", kind: "hint" }]);
      return;
    }
    setQuery("");

    if (!aiMode) {
      setMessages((m) => [...m, { role: "user", text: q }, keywordAnswer(q)]);
      return;
    }

    // AI 模式：先掛上打字中的泡泡，回來再換掉。失敗就退回關鍵字，至少給得出東西。
    setBusy(true);
    setMessages((m) => [...m, { role: "user", text: q }, { role: "bot", kind: "typing" }]);
    agentAsk(endpoint, q, thread()).then(
      (answer) => setMessages((m) => [
        ...m.filter((x) => x.kind !== "typing"),
        { role: "bot", kind: "agent", text: answer },
      ]),
      () => setMessages((m) => [
        ...m.filter((x) => x.kind !== "typing"),
        { role: "bot", kind: "agentfail" },
        keywordAnswer(q),
      ])
    ).finally(() => setBusy(false));
  };

  const toggleMode = () => {
    if (!aiReady) {  // 沒有位址或探測失敗：說明怎麼把 agent 跑起來，模式不動
      setMessages((m) => [...m, { role: "bot", kind: "aihelp" }]);
      return;
    }
    const next = mode === "ai" ? "kw" : "ai";
    setMode(next);
    lsSet(MODE_LS, next);
    setMessages((m) => [...m, { role: "bot", kind: next === "ai" ? "aion" : "aioff" }]);
  };

  const clearChat = () => {
    threadRef.current = agentThread(true);  // 換一組 thread_id，agent 那邊的記憶也跟著重來
    setMessages([{ role: "bot", kind: "greet" }]);
    setQuery("");
  };

  const browseTrack = (code) => {
    const { items, topicHits } = recommend(D.TOPICS[code][1]);
    setMessages((m) => [
      ...m,
      { role: "user", text: D.TOPICS[code][lang === "zh" ? 0 : 1] },
      items.length ? { role: "bot", kind: "result", items, topicHits } : { role: "bot", kind: "nomatch" },
    ]);
  };

  const T = BOT_T[lang] || BOT_T.en;
  const trackCodes = Object.keys(D.TOPICS).filter((c) => c !== "OT");

  const helpNote = (
    <div className="bot-note">
      {T.aiHelp} <code>uvicorn agent.main:app --host 127.0.0.1 --port 8765</code> — {T.aiHelpTail}
    </div>
  );

  const renderMsg = (m, i) => {
    if (m.role === "user") return <div className="bot-msg user" key={i}>{m.text}</div>;
    if (m.kind === "greet") return <div className="bot-msg bot" key={i}>{aiMode ? T.aiGreet : T.greet}</div>;
    if (m.kind === "hint") return <div className="bot-msg bot" key={i}>{T.emptyHint}</div>;
    if (m.kind === "typing") return (
      <div className="bot-msg bot" key={i}>
        <span className="bot-typing" aria-label={T.modeAi}><i /><i /><i /></span>
      </div>
    );
    if (m.kind === "agent") return (
      <div className="bot-msg bot" key={i}><AgentAnswer text={m.text} onSelect={onSelect} /></div>
    );
    if (m.kind === "agentfail") return (
      <div className="bot-msg bot" key={i}>{T.aiFailed}{helpNote}</div>
    );
    if (m.kind === "aihelp") return <div className="bot-msg bot" key={i}>{helpNote}</div>;
    if (m.kind === "aion") return <div className="bot-msg bot" key={i}>{T.aiOn}</div>;
    if (m.kind === "aioff") return <div className="bot-msg bot" key={i}>{T.aiOff}</div>;
    if (m.kind === "nomatch") return (
      <div className="bot-msg bot" key={i}>
        <div>{T.noMatch}</div>
        <div className="bot-tracks">
          {trackCodes.map((c) => (
            <button className={"bot-track-chip tk-" + c} key={c} onClick={() => browseTrack(c)}>
              <span className="dot" />{D.TOPICS[c][lang === "zh" ? 0 : 1]}
            </button>
          ))}
        </div>
      </div>
    );
    // result
    return (
      <div className="bot-msg bot" key={i}>
        <div className="bot-intro">{botIntro(m.topicHits, m.items.length, lang)}</div>
        <div className="bot-cards">
          {m.items.map((s) => <BotCard key={s[7]} s={s} lang={lang} onSelect={onSelect} />)}
        </div>
      </div>
    );
  };

  // 下拉關閉手勢只掛在「握把＋標題列」拖曳區；.bot-log 維持純原生捲動，不受干擾。
  const dragZone = mobile ? { ref: drag.ref, ...drag.handlers } : {};

  const body = (
    <React.Fragment>
      <div className="bot-draghandle" {...dragZone}>
        {mobile && <div className="bot-grab" />}
        <div className="bot-head">
          <div className="bot-head-t">
            <span className="bot-h1">{T.title}</span>
            <span className="bot-h2">{aiMode ? T.aiSub : T.sub}</span>
          </div>
          <button className={"bot-mode" + (aiMode ? " on" : "")} title={T.modeTitle}
            aria-pressed={aiMode} onClick={toggleMode}>
            <span className="dot" />{aiMode ? T.modeAi : T.modeKw}
          </button>
          {messages.length > 1 && (
            <button className="bot-clear" title={T.clear} aria-label={T.clear} onClick={clearChat}>↺</button>
          )}
          <button className="bot-x" title={T.close} aria-label={T.close} onClick={onClose}>×</button>
        </div>
      </div>
      <div className="bot-log" ref={logRef}>
        {messages.map(renderMsg)}
      </div>
      <div className="bot-input-row">
        <input
          ref={inputRef}
          value={query}
          disabled={busy}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={(e) => {
            // 擋輸入法組字中的 Enter（注音/拼音選字），避免半成品誤送
            if (e.key === "Enter" && !e.nativeEvent.isComposing && e.keyCode !== 229) send();
          }}
          placeholder={aiMode ? T.aiPlaceholder : T.placeholder}
        />
        <button className="bot-send" onClick={send} disabled={busy}>{T.send}</button>
      </div>
    </React.Fragment>
  );

  /* 桌機：停靠成右側欄，和議程並排。收合時保持掛載（用 hidden-el 藏起來），
     對話紀錄才不會在關閉後被清掉。 */
  if (docked) {
    return (
      <aside className={"chat-dock" + (open ? "" : " hidden-el")} style={{ width: width + "px" }}>
        {body}
      </aside>
    );
  }

  return (
    <div className={"bot-ov" + (open ? " show" : "")} onClick={onClose}>
      <div className="bot-panel" onClick={(e) => e.stopPropagation()} style={mobile ? drag.style : undefined}>
        {body}
      </div>
    </div>
  );
}

const THEME_LS = "sff-theme";
const initialDark = () => {
  const v = lsGet(THEME_LS);
  if (v) return v === "dark";
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
};

function App() {
  const [t, setTweak] = useTweaks(useMemo(() => ({ ...TWEAK_DEFAULTS, dark: initialDark() }), []));
  const [route, go] = useRoute();
  const toggleDark = () => { lsSet(THEME_LS, t.dark ? "light" : "dark"); setTweak("dark", !t.dark); };
  const [cur, setCur] = useState("d1");
  const [view, setView] = useState("grid");
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(null); }, [route.page]);
  const [search, setSearch] = useState("");
  const [topics, setTopics] = useState(() => new Set());
  const [rooms, setRooms] = useState(() => new Set());
  const [access, setAccess] = useState(() => new Set());
  const [filterOpen, setFilterOpen] = useState(false);
  const [botOpen, setBotOpen] = useState(false);
  const [lang, setLang] = useLang();
  const forceMobile = useMemo(() => new URLSearchParams(location.search).get("m") === "1", []);
  const isMobile = useMediaQuery("(max-width: 720px)") || forceMobile;

  const day = D.DAYS.find((d) => d.k === cur);
  const sessions = useMemo(() => D.S.filter((s) => s[0] === cur), [cur]);
  /* 桌機的日曆 / 清單吃篩選後的結果；手機在 MobileView 內自己篩（還要疊上搜尋） */
  const shown = useMemo(() => applyFilters(sessions, topics, access), [sessions, topics, access]);
  const filterCount = topics.size + access.size;
  const clearFilters = () => { setTopics(new Set()); setAccess(new Set()); };
  const accessOpts = useMemo(accessOptions, []);

  /* 對話框停靠寬度。拖曳中先用 dragW（本地 state），放開才寫回 tweaks ——
     setTweak 每次都會 postMessage 給編輯器，不適合每個 mousemove 都送。 */
  const [dragW, setDragW] = useState(null);
  const [resizing, setResizing] = useState(false);
  const clampW = (w) => Math.round(Math.min(Math.max(320, window.innerWidth - 420), Math.max(300, w)));
  const chatW = clampW(dragW != null ? dragW : t.chatWidth);
  const startResize = (e) => {
    e.preventDefault();
    const x0 = e.clientX, w0 = chatW;
    setResizing(true);
    const move = (ev) => setDragW(clampW(w0 - (ev.clientX - x0)));
    const up = (ev) => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
      setResizing(false);
      setDragW(null);
      setTweak("chatWidth", clampW(w0 - (ev.clientX - x0)));
    };
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  };
  const resetWidth = () => { setDragW(null); setTweak("chatWidth", TWEAK_DEFAULTS.chatWidth); };

  useEffect(() => {
    const r = document.documentElement;
    r.setAttribute("data-theme", t.dark ? "dark" : "light");
  }, [t.dark]);

  if (route.page === "replay") {
    return <ReplayPage route={route} go={go} lang={lang} setLang={setLang} dark={t.dark} toggleDark={toggleDark} />;
  }

  if (isMobile) {
    return (
      <MobileShell
        framed={forceMobile}
        t={t} setTweak={setTweak} go={go} toggleDark={toggleDark}
        cur={cur} setCur={setCur}
        sel={sel} setSel={setSel}
        search={search} setSearch={setSearch}
        topics={topics} setTopics={setTopics}
        rooms={rooms} setRooms={setRooms}
        access={access} setAccess={setAccess}
        filterOpen={filterOpen} setFilterOpen={setFilterOpen}
        botOpen={botOpen} setBotOpen={setBotOpen}
        lang={lang} setLang={setLang}
      />
    );
  }

  return (
    <div className="app" data-ci={t.colorIntensity}>
      <SiteHeader page="agenda" go={go} lang={lang} setLang={setLang} dark={t.dark} toggleDark={toggleDark} total={replayData().items.length} />

      <div className="workarea">
      <div className="mainpane">
      <div className="daybar">
        {D.DAYS.map((d) => {
          const m = dayMeta(d.k);
          return (
            <button key={d.k} className={"day" + (d.k === cur ? " on" : "")}
              title={m.label} onClick={() => setCur(d.k)}>
              <span className="dn">{m.wd}</span>
              <span className="dd">{m.date}</span>
            </button>
          );
        })}
        <div className="agenda-tools">
          <div className="seg">
            <button className={view === "grid" ? "on" : ""} onClick={() => setView("grid")}>{lang === "zh" ? "日曆" : "Calendar"}</button>
            <button className={view === "list" ? "on" : ""} onClick={() => setView("list")}>{lang === "zh" ? "清單" : "List"}</button>
          </div>
          <button className={"tool-btn" + (botOpen ? " on" : "")} title="議程小幫手 Agenda helper"
            aria-pressed={botOpen} onClick={() => setBotOpen(!botOpen)}><Icon name="chat" />{lang === "zh" ? "小幫手" : "Helper"}</button>
        </div>
      </div>

      <div className={"legend" + (filterCount ? " filtering" : "")}>
        {Object.entries(D.TOPICS).map(([k, v]) => (
          <button className={"lg tk-" + k + (topics.has(k) ? " on" : "")} key={k}
            aria-pressed={topics.has(k)}
            title={"只看「" + v[0] + "」的場次"}
            onClick={() => setTopics(toggleIn(topics, k))}>
            <span className="dot" />{v[lang === "zh" ? 0 : 1]}
          </button>
        ))}
        <span className="sep" />
        {filterCount > 0 && (
          <button className="lg-clear" onClick={clearFilters}>
            清除篩選 Clear ({filterCount})
          </button>
        )}
        {accessOpts.map(([k, en, zh]) => (
          <button className={"mk" + (access.has(k) ? " on" : "")} key={k}
            aria-pressed={access.has(k)}
            title={"只看" + zh + "的場次"}
            onClick={() => setAccess(toggleIn(access, k))}>
            {accOf(k).mk} {lang === "zh" ? zh : en}
          </button>
        ))}
      </div>

      {view === "grid"
        ? <CalendarView day={day} sessions={shown} hourHeight={t.hourHeight}
            colWidth={t.colWidth} quarterLines={t.quarterLines}
            compactMax={t.compactMax} onSelect={setSel} />
        : <ListView day={day} sessions={shown} onSelect={setSel} lang={lang} />}
      </div>

      {botOpen && (
        <div className={"split" + (resizing ? " on" : "")} title="拖曳調整寬度 · 雙擊還原"
          onMouseDown={startResize} onDoubleClick={resetWidth}>
          <span className="grip" />
        </div>
      )}
      <ChatBot open={botOpen} mobile={false} docked width={chatW} lang={lang}
        onClose={() => setBotOpen(false)} onSelect={setSel} />
      </div>

      {sel && <Modal s={sel} onClose={() => setSel(null)} lang={lang} />}

      <TweaksPanel>
        <TweakSection label="外觀 Appearance" />
        <TweakToggle label="深色模式 Dark" value={t.dark} onChange={(v) => setTweak("dark", v)} />
        <TweakRadio label="色彩濃度 Color" value={t.colorIntensity}
          options={["subtle", "tinted", "vivid"]}
          onChange={(v) => setTweak("colorIntensity", v)} />

        <TweakSection label="網格 Grid" />
        <TweakSlider label="時段高度 Hour height" value={t.hourHeight} min={52} max={150} step={2} unit="px"
          onChange={(v) => setTweak("hourHeight", v)} />
        <TweakSlider label="欄寬 Column width" value={t.colWidth} min={112} max={260} step={2} unit="px"
          onChange={(v) => setTweak("colWidth", v)} />
        <TweakSlider label="短場次門檻 Compact under" value={t.compactMax} min={0} max={30} step={5} unit="min"
          onChange={(v) => setTweak("compactMax", v)} />
        <TweakToggle label="15 分鐘格線 Quarter lines" value={t.quarterLines} onChange={(v) => setTweak("quarterLines", v)} />

        <TweakSection label="對話框 Chat" />
        <TweakSlider label="對話框寬度 Chat width" value={t.chatWidth} min={300} max={640} step={10} unit="px"
          onChange={(v) => setTweak("chatWidth", v)} />
      </TweaksPanel>

      {!botOpen && <BotLauncher lang={lang} onClick={() => setBotOpen(true)} />}
    </div>
  );
}

/* ------------------------------------------------------------
   與 agenda.csv 載入器交接。
   這支 script 是 text/babel，Babel 轉譯完成的時間點不一定比 fetch 早，
   所以兩邊互相握手 —— 誰後到誰負責 mount，只會 mount 一次。
   ------------------------------------------------------------ */
let __mounted = false;
function __sffMount() {
  if (__mounted) return;
  __mounted = true;
  initData();
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
window.__sffMount = __sffMount;
if (window.__sffDataReady) __sffMount();

</script>
