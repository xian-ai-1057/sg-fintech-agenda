<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SFF 2026 回放筆記</title>
<meta name="description" content="Singapore FinTech Festival 2026 四個主舞台 118 場演講的繁中回放重點：每場一句話結論與重點條列。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<script>
/* 共編行事曆入口：自架服務會直接在 <html> 加上 data-selfhost；部署在 Vercel 時改由這裡探測同站的
   共編 API（api/health）。GitHub Pages 上沒有 API，請求 404，入口維持隱藏。 */
if (!document.documentElement.hasAttribute("data-selfhost") && /^https?:$/.test(location.protocol)) {
  fetch("api/health", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.service === "sff-team-calendar") document.documentElement.setAttribute("data-selfhost", "true"); })
    .catch(function () {});
}
</script>
<style>
/* ============================================================
   SFF 2026 Agenda — Apple Calendar inspired
   Light + dark themes via CSS custom properties.
   ============================================================ */

:root {
  /* 字體：介面用 IBM Plex Sans＋Noto Sans TC，標題與引言用 Noto Serif TC，時間與計數用 IBM Plex Mono */
  --font: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
          -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* surfaces：會後筆記本的紙色（暖色中性灰階） */
  --bg: #f7f4ee;
  --surface: #fdfbf7;
  --surface-2: #faf7f1;
  --surface-hover: #efe9df;

  /* text：三種文字角色＋一個更淡的格線字色 */
  --text-strong: #1f1b16;
  --text: #5e554a;
  --text-soft: #7b7266;
  --text-faint: #a39b8f;

  /* lines */
  --separator: rgba(31, 27, 22, 0.10);
  --separator-strong: rgba(31, 27, 22, 0.18);
  --hairline: rgba(31, 27, 22, 0.08);

  /* interactive：介面只用墨色；紅筆只出現在回放的重點劃線 */
  --accent: #1f1b16;
  --on-accent: #fdfbf7;
  --accent-soft: rgba(31, 27, 22, 0.07);
  --pen: #b3261e;
  --pen-soft: rgba(179, 38, 30, 0.10);

  /* shape */
  --radius-chip: 6px;
  --radius-ctl: 8px;
  --radius-card: 14px;
  --radius-pill: 980px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  /* layout (overridden inline by tweaks) */
  --gutter-w: 60px;
  --head-h: 56px;
  --shadow-pop: 0 1px 2px rgba(31,27,22,.05), 0 8px 24px rgba(31,27,22,.08);
  --shadow-chip: 0 8px 24px rgba(31,27,22,.10);

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #161513;
  --surface: #1c1a18;
  --surface-2: #12110f;
  --surface-hover: #262421;

  --text-strong: #efe9de;
  --text: #aaa398;
  --text-soft: #8a847a;
  --text-faint: #625d55;

  --separator: rgba(239, 233, 222, 0.09);
  --separator-strong: rgba(239, 233, 222, 0.16);
  --hairline: rgba(239, 233, 222, 0.07);

  --accent: #efe9de;
  --on-accent: #161513;
  --accent-soft: rgba(239, 233, 222, 0.08);
  --pen: #ff8a7a;
  --pen-soft: rgba(255, 138, 122, 0.12);

  --shadow-pop: 0 1px 2px rgba(0,0,0,.3), 0 16px 48px rgba(0,0,0,.5);
  --shadow-chip: 0 8px 26px rgba(0,0,0,.45);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-strong);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
#root { height: 100%; }

/* ---------- 資料載入前的狀態畫面（載入中／空資料／讀不到 CSV）---------- */
.boot { max-width: 620px; margin: 0 auto; padding: 12vh 24px 48px; text-align: center; color: var(--text); }
.boot-h { font-size: 21px; font-weight: 600; letter-spacing: -.01em; color: var(--text-strong); margin: 0 0 6px; }
.boot-msg { font-size: 14px; color: var(--text-soft); margin: 0 0 22px; line-height: 1.6; }
.boot-msg span { font-size: 13px; }
.boot-body { font-size: 14px; line-height: 1.75; color: var(--text); text-align: left; margin: 14px 0; }
.boot-body a { color: var(--accent); }
.boot code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
  background: var(--surface-hover); border-radius: 5px; padding: 1px 5px; }
.boot-pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.7;
  text-align: left; background: var(--surface-hover); border: 1px solid var(--separator);
  border-radius: var(--radius-card); padding: 12px 14px; overflow-x: auto; white-space: pre; margin: 10px 0 18px; }
.boot-note { font-size: 12px; color: var(--text-soft); margin-top: 26px; word-break: break-word; }
.boot-drop { display: block; border: 1.5px dashed var(--separator-strong); border-radius: var(--radius-card);
  padding: 26px 18px; font-size: 13.5px; color: var(--text-soft); cursor: pointer; transition: .15s ease; }
.boot-drop:hover, .boot-drop.over { border-color: var(--accent); color: var(--text-strong);
  background: color-mix(in srgb, var(--accent) 7%, transparent); }
.boot-drop b { color: var(--accent); font-weight: 600; }
.boot-spin { width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
  border: 2.5px solid var(--separator); border-top-color: var(--accent); animation: boot-spin .8s linear infinite; }
@keyframes boot-spin { to { transform: rotate(360deg); } }

/* ---------- track colors ----------
   .tk-XX { --c: … } 由 agenda.csv 載入器在執行時注入（見 TRACK_CFG / PALETTE），
   所以 track 數量不受這裡的 class 數量限制。下面只是資料還沒到時的保險色。 */
[class*="tk-"] { --c: #8a8a8e; }

/* ============================================================
   App shell
   ============================================================ */
.hidden-el { display: none !important; }

.app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

/* 議程 + 右側對話框並排。桌機聊天視窗展開時不覆蓋議程，而是把
   議程欄壓窄（欄位縮到 colWidth 最小值後才開始水平捲動）。 */
.workarea { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.mainpane { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; overflow: hidden; }

.split {
  flex: 0 0 auto; width: 9px; cursor: col-resize;
  background: var(--surface-2); border-left: 1px solid var(--separator);
  display: grid; place-items: center; position: relative; z-index: 50;
}
.split:hover, .split.on { background: var(--surface-hover); }
.split .grip { width: 3px; height: 36px; border-radius: 2px; background: var(--separator-strong); transition: background .14s; }
.split:hover .grip, .split.on .grip { background: var(--accent); }

.chat-dock {
  flex: 0 0 auto; display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border-left: 1px solid var(--separator);
}

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--separator);
}
.brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
.brand .t1 {
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--text-strong);
}
.brand .t2 { font-size: 12px; color: var(--text-soft); letter-spacing: .01em; }

/* segmented control (Apple style) */
.seg {
  display: inline-flex; background: var(--surface-hover);
  border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  font: inherit; font-size: 13px; font-weight: 500;
  border: none; background: transparent; color: var(--text);
  padding: 5px 14px; border-radius: 7px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.seg button.on {
  background: var(--surface);
  color: var(--text-strong);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
}
[data-theme="dark"] .seg button.on { background: #48484a; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: none;
  background: var(--surface-hover); color: var(--text);
  cursor: pointer; font-size: 16px; display: grid; place-items: center;
  transition: background .15s;
}
.icon-btn:hover { background: var(--separator-strong); }

.reg-btn {
  font: inherit; font-size: 13px; font-weight: 600;
  background: var(--accent); color: var(--on-accent); text-decoration: none;
  padding: 7px 16px; border-radius: var(--radius-pill);
}

/* ---------- day selector ----------
   Deliberately compact: a single-line pill row, so the calendar below it
   gets the vertical space and the visual weight. The day's stage label
   lives in the button's title — the calendar's column headers already
   name the stages. */
.daybar {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 24px; background: var(--surface);
  border-bottom: 1px solid var(--separator);
  overflow-x: auto;
}
.day {
  flex: 0 0 auto;
  border: 1px solid var(--separator-strong); background: transparent;
  border-radius: var(--radius-pill); padding: 4px 13px; cursor: pointer;
  font: inherit; color: var(--text); transition: background .15s, border-color .15s;
  display: flex; align-items: baseline; gap: 6px;
}
.day:hover { background: var(--surface-hover); }
.day .dn { font-size: 11px; font-weight: 500; color: var(--text-soft); }
.day .dd {
  font-size: 13px; font-weight: 600; color: var(--text-strong);
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.day.on {
  background: var(--accent); border-color: var(--accent);
}
.day.on .dd { color: var(--on-accent); }
.day.on .dn { color: var(--on-accent); opacity: .72; }

/* ---------- legend ---------- */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px;
  padding: 6px 20px; background: var(--surface-2);
  border-bottom: 1px solid var(--separator);
  font-size: 12px; color: var(--text-soft);
}
.legend .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); display: inline-block; }
.legend .sep { margin-left: auto; }
/* 圖例同時就是篩選器：點主題或參加資格即可過濾，不另外佔一列 */
.legend .lg, .legend .mk {
  font: inherit; font-size: 12px; color: var(--text-soft);
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius-pill); padding: 3px 9px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, color .15s, opacity .15s;
}
.legend .lg:hover, .legend .mk:hover {
  background: var(--surface-hover); border-color: var(--separator-strong);
}
.legend .lg.on {
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
  border-color: var(--c); color: var(--text-strong); font-weight: 500;
}
.legend .mk.on {
  background: var(--surface-hover); border-color: var(--separator-strong);
  color: var(--text-strong); font-weight: 600;
}
/* 有篩選時，未選中的項目退到背景 */
.legend.filtering .lg:not(.on), .legend.filtering .mk:not(.on) { opacity: .4; }
.lg-clear {
  font: inherit; font-size: 11.5px; font-weight: 500;
  color: var(--accent); background: transparent;
  border: 1px solid var(--separator-strong); border-radius: var(--radius-pill);
  padding: 3px 10px; cursor: pointer; margin-left: 4px;
}
.lg-clear:hover { background: var(--surface-hover); }

/* ============================================================
   Calendar (grid) view
   ============================================================ */
.scroll { flex: 1; overflow: auto; background: var(--surface); position: relative; }

.cal { display: grid; position: relative; }

.corner {
  position: sticky; top: 0; left: 0; z-index: 45;
  height: var(--head-h); background: var(--surface);
  border-right: 1px solid var(--separator);
  border-bottom: 1px solid var(--separator-strong);
}
.colhead {
  position: sticky; top: 0; z-index: 30;
  height: var(--head-h); background: var(--surface);
  border-bottom: 1px solid var(--separator-strong);
  border-left: 1px solid var(--separator);
  padding: 8px 10px; display: flex; flex-direction: column; justify-content: center;
  gap: 1px; overflow: hidden;
}
.colhead .code { font-size: 13px; font-weight: 650; color: var(--text-strong); letter-spacing: -0.01em; }
.colhead .name {
  font-size: 11px; color: var(--text-soft); line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.gutter {
  position: sticky; left: 0; z-index: 20;
  background: var(--surface);
  border-right: 1px solid var(--separator);
}
.hourlabel {
  position: absolute; right: 8px;
  font-size: 11px; font-weight: 500; color: var(--text-soft);
  letter-spacing: 0.01em;
}

.colbody {
  position: relative;
  border-left: 1px solid var(--separator);
  background-repeat: repeat;
}

/* event chip */
.ev {
  position: absolute;
  height: var(--h);
  border-radius: var(--radius-chip);
  padding: 4px 7px 4px 8px;
  overflow: hidden; cursor: pointer;
  border-left: 3px solid var(--c);
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  color: var(--text-strong);
  box-shadow: 0 0 0 1px var(--surface);
  transition: box-shadow .14s ease, transform .14s ease;
  display: flex; flex-direction: column; gap: 1px;
}
.ev:hover {
  height: auto; min-height: var(--h);
  z-index: 60; box-shadow: var(--shadow-chip);
  transform: translateY(-1px);
}
.ev .etm {
  font-size: 10.5px; font-weight: 500; color: var(--text-soft);
  white-space: nowrap; line-height: 1.2;
}
.ev .ett {
  font-size: 12px; font-weight: 600; line-height: 1.28; letter-spacing: -0.005em;
  color: var(--text-strong);
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  -webkit-line-clamp: var(--lines, 2);
}
.ev:hover .ett { -webkit-line-clamp: unset; }
.ev .mk { position: absolute; top: 4px; right: 5px; font-size: 9.5px; opacity: .8; }

/* compact variant — short sessions collapse to a single line */
.ev.cmp {
  flex-direction: row; align-items: center; gap: 7px;
  padding: 0 8px 0 8px;
  background: color-mix(in srgb, var(--c) 9%, var(--surface));
}
.ev.cmp .etm { flex: 0 0 auto; }
.ev.cmp .ett {
  display: block; flex: 1 1 auto; min-width: 0;
  font-size: 11.5px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ev.cmp:hover {
  flex-direction: column; align-items: stretch; gap: 1px;
  padding: 4px 7px 4px 8px;
}
.ev.cmp:hover .ett { white-space: normal; }
.ev.cmp:hover .mk { position: static; font-size: 9px; opacity: .75; }

/* true-start tick for chips nudged off the axis */
.tick {
  position: absolute; left: -5px; width: 9px; height: 1px;
  background: var(--c); opacity: .6; pointer-events: none;
}
[data-ci="subtle"] .ev.cmp { background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
[data-ci="vivid"]  .ev.cmp { background: color-mix(in srgb, var(--c) 18%, var(--surface)); }

/* color intensity variants */
[data-ci="subtle"] .ev { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
[data-ci="vivid"]  .ev { background: color-mix(in srgb, var(--c) 24%, var(--surface)); }
[data-ci="vivid"]  .ev .ett { color: color-mix(in srgb, var(--c) 62%, var(--text-strong)); }
[data-ci="vivid"]  .ev .etm { color: color-mix(in srgb, var(--c) 45%, var(--text-soft)); }

.empty {
  padding: 70px 24px; text-align: center; color: var(--text-soft); font-size: 14px;
}

/* ============================================================
   List / Agenda view
   ============================================================ */
.list { flex: 1; overflow: auto; background: var(--bg); }
.list-inner { max-width: 860px; margin: 0 auto; padding: 18px 20px 80px; }

.hourgroup { margin-top: 10px; }
.hourgroup-h {
  position: sticky; top: 0; z-index: 5;
  font-size: 12px; font-weight: 600; color: var(--text-soft);
  letter-spacing: 0.04em; padding: 12px 4px 8px;
  background: linear-gradient(var(--bg) 70%, transparent);
}

.litem {
  display: grid; grid-template-columns: 78px 1fr; gap: 14px;
  background: var(--surface); border: 1px solid var(--separator);
  border-radius: 14px; padding: 13px 16px; margin-bottom: 8px;
  cursor: pointer; transition: border-color .14s, box-shadow .14s, transform .14s;
}
.litem:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-1px); }
[data-theme="dark"] .litem:hover { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.litem .ltime { display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--c); padding-left: 10px; }
.litem .ltime .s { font-size: 14px; font-weight: 600; color: var(--text-strong); }
.litem .ltime .e { font-size: 12px; color: var(--text-soft); }
.litem .ltime .dur { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }
.litem .lbody { min-width: 0; }
.litem .ltitle { font-size: 14.5px; font-weight: 600; line-height: 1.34; letter-spacing: -0.01em; color: var(--text-strong); }
.litem .lmeta { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--text-soft); }
.litem .lmeta .tk { display: inline-flex; align-items: center; gap: 5px; }
.litem .lmeta .tk .dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--c); }
.litem .lmeta .room { font-weight: 500; color: var(--text); }
.litem .lspk { margin-top: 6px; font-size: 12px; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================
   Modal (event detail popover)
   ============================================================ */
.ov {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.32); backdrop-filter: blur(6px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 7vh 16px 40px; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.ov.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 540px; background: var(--surface);
  border-radius: var(--radius-card); box-shadow: var(--shadow-pop);
  border-top: 4px solid var(--c);
  padding: 26px 26px 24px; position: relative;
  transform: translateY(10px) scale(.98); transition: transform .2s cubic-bezier(.2,.7,.2,1);
}
.ov.show .modal { transform: none; }
.modal-grab { display: none; }
.modal .x {
  position: absolute; top: 16px; right: 16px; width: 28px; height: 28px;
  border: none; border-radius: 50%; background: var(--surface-hover);
  color: var(--text-soft); font-size: 16px; cursor: pointer; display: grid; place-items: center;
}
.modal .x:hover { background: var(--separator-strong); color: var(--text-strong); }
.modal .mtrack { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--c); letter-spacing: .01em; }
.modal .mtrack .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.modal h2 { margin-top: 10px; font-size: 21px; font-weight: 650; line-height: 1.32; letter-spacing: -0.02em; color: var(--text-strong); padding-right: 30px; }
.modal .mrow { margin-top: 16px; display: flex; gap: 11px; align-items: flex-start; font-size: 14px; color: var(--text); }
.modal .mrow .mi { width: 18px; flex: 0 0 18px; text-align: center; color: var(--text-faint); font-size: 13px; margin-top: 1px; }
.modal .mrow b { color: var(--text-strong); font-weight: 600; }
.modal .badges { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.badge { font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: var(--radius-pill); border: 1px solid var(--separator-strong); color: var(--text); }
.badge.open { color: #2fa15a; border-color: rgba(47,161,90,.4); background: rgba(47,161,90,.08); }
.badge.invite { color: #db5793; border-color: rgba(219,87,147,.4); background: rgba(219,87,147,.08); }
.badge.premium { color: #c2952a; border-color: rgba(194,149,42,.45); background: rgba(194,149,42,.10); }
.modal .spk { margin-top: 18px; }
.modal .spk .lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 9px; }
.modal .spk .chips { display: flex; flex-wrap: wrap; gap: 7px; }
.modal .spk .chip { font-size: 12.5px; padding: 5px 11px; border-radius: var(--radius-pill); background: var(--surface-hover); color: var(--text); }
.modal .spk .chip.more { cursor: pointer; border: none; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--surface-hover); }
.modal .spk .chip.more:hover { background: var(--separator-strong); }
.modal .mdesc { margin-top: 18px; }
.modal .mdesc .lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 9px; }
.modal .mdesc p { font-size: 14px; line-height: 1.62; color: var(--text); margin: 0 0 10px; white-space: pre-line; }
.modal .mdesc p:last-child { margin-bottom: 0; }
.modal .mdesc em { font-style: italic; color: var(--text-strong); }
.modal .mrecap { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--hairline); }
.modal .mrecap summary.lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 9px; cursor: pointer; list-style: none; }
.modal .mrecap summary.lab::-webkit-details-marker { display: none; }
.modal .mrecap-body { font-size: 13.5px; line-height: 1.62; color: var(--text); }
.modal .mrecap-body h4 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; color: var(--text-strong); }
.modal .mrecap-body h4:first-child { margin-top: 0; }
.modal .mrecap-body p { margin: 0 0 8px; }
.modal .mrecap-body ol, .modal .mrecap-body ul { margin: 0 0 8px; padding-left: 20px; }
.modal .mrecap-body li { margin-bottom: 5px; }
.modal .mrecap-body li ul { margin: 4px 0 0; }
.modal .mrecap-body strong { font-weight: 650; color: var(--text-strong); }
.modal .mrecap-body table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 4px 0 10px; display: block; overflow-x: auto; }
.modal .mrecap-body th, .modal .mrecap-body td { border: 1px solid var(--hairline); padding: 5px 7px; text-align: left; vertical-align: top; }
.modal .mrecap-note { font-size: 11.5px; color: var(--text-soft); margin: 8px 0 0; }
.rtag { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 600; color: var(--accent); border: 1px solid currentColor; border-radius: var(--radius-pill); padding: 0 6px; vertical-align: 1px; white-space: nowrap; }
.litem .ldesc { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--text-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard .mc-desc { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--text-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; }
.lang-btn { font-size: 13px; font-weight: 700; }
.mlang { border: none; background: var(--separator); color: var(--text); border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; padding: 0 11px; height: 30px; cursor: pointer; }
.modal a.ext {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 20px;
  background: var(--accent); color: var(--on-accent); text-decoration: none;
  font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: var(--radius-pill);
}

/* scrollbars */
.scroll::-webkit-scrollbar, .list::-webkit-scrollbar { width: 11px; height: 11px; }
.scroll::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb {
  background: var(--separator-strong); border-radius: 6px; border: 3px solid var(--surface);
}
.daybar::-webkit-scrollbar { height: 0; }

@media (max-width: 640px) {
  .topbar, .daybar, .legend { padding-left: 14px; padding-right: 14px; }
  .brand .t1 { font-size: 15px; }
}

/* ============================================================
   Mobile — responsive single-column timeline (g0v-inspired)
   ============================================================ */
.mapp { display: flex; flex-direction: column; height: 100%; background: var(--bg); overflow: hidden; }
.mapp.framed {
  max-width: 430px; margin: 0 auto;
  border-left: 1px solid var(--separator-strong);
  border-right: 1px solid var(--separator-strong);
}

.mtopbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 11px) 16px 11px;
  background: var(--surface); border-bottom: 1px solid var(--separator);
}
.mbrand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; min-width: 0; }
.mbrand .mb1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-strong); }
.mbrand .mb2 {
  font-size: 11px; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.micon {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; border: none;
  background: var(--surface-hover); color: var(--text); font-size: 17px; cursor: pointer;
  display: grid; place-items: center;
}
.micon:active { background: var(--separator-strong); }
.mtop-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.mtop-actions .mlang { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-hover); padding: 0; }

.mdaystrip {
  flex: 0 0 auto; display: flex; gap: 7px; overflow-x: auto;
  padding: 9px 16px; background: var(--surface);
  border-bottom: 1px solid var(--separator); scrollbar-width: none;
}
.mdaystrip::-webkit-scrollbar { display: none; }
.mday {
  flex: 0 0 auto; min-width: 56px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  border: 1px solid var(--separator-strong); background: transparent;
  border-radius: 12px; padding: 6px 12px; cursor: pointer; font: inherit; color: var(--text);
  transition: background .14s, border-color .14s;
}
.mday .md-wd { font-size: 11px; color: var(--text-soft); font-weight: 500; }
.mday .md-dt { font-size: 14.5px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.mday.on { background: var(--accent); border-color: var(--accent); }
.mday.on .md-wd { color: var(--on-accent); opacity: .72; }
.mday.on .md-dt { color: var(--on-accent); }

.mfilterbar {
  flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
  padding: 9px 16px; background: var(--surface-2);
  border-bottom: 1px solid var(--separator);
}
.msearch {
  flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0;
  background: var(--surface-hover); border-radius: 10px; padding: 0 10px; height: 38px;
}
.msearch-i { font-size: 17px; color: var(--text-soft); }
.msearch input {
  flex: 1; min-width: 0; border: none; background: transparent; outline: none;
  font: inherit; font-size: 14px; color: var(--text-strong);
}
.msearch input::placeholder { color: var(--text-faint); }
.msearch-x { border: none; background: none; color: var(--text-soft); font-size: 19px; line-height: 1; cursor: pointer; padding: 0 2px; }
.mfbtn {
  flex: 0 0 auto; height: 38px; padding: 0 15px; border-radius: 10px;
  border: 1px solid var(--separator-strong); background: var(--surface);
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer;
  white-space: nowrap;
}
.mfbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.mlist {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 44px);
}
.mgroup-h {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px; padding: 14px 2px 8px;
  background: linear-gradient(var(--bg) 72%, transparent);
}
.mgroup-h .mh-time { font-size: 13px; font-weight: 700; color: var(--text-strong); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.mgroup-h .mh-line { flex: 1; height: 1px; background: var(--separator); }
.mgroup-h .mh-cnt { font-size: 11px; font-weight: 600; color: var(--text-faint); }

.mcard {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--separator);
  border-left: 3px solid var(--c); border-radius: 13px;
  padding: 11px 13px 12px; margin-bottom: 8px;
  cursor: pointer; font: inherit; color: var(--text-strong);
  -webkit-tap-highlight-color: transparent; transition: transform .12s ease;
}
.mcard:active { transform: scale(.985); }
.mc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.mc-time { font-size: 12.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mc-dur { font-size: 11px; color: var(--text-faint); }
.mc-mk { margin-left: auto; font-size: 11px; opacity: .75; }
.mc-title {
  font-size: 15px; font-weight: 600; line-height: 1.34; letter-spacing: -0.01em;
  color: var(--text-strong); text-wrap: pretty;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.mc-meta { margin-top: 8px; display: flex; align-items: center; gap: 9px; min-width: 0; }
.mc-topic { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-soft); font-weight: 500; white-space: nowrap; flex: 0 0 auto; }
.mc-topic .dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--c); flex: 0 0 auto; }
.mc-room {
  margin-left: auto; flex: 0 1 auto; min-width: 0;
  font-size: 11px; font-weight: 600; color: var(--text);
  background: var(--surface-hover); padding: 2px 8px; border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.mempty { padding: 76px 30px; text-align: center; color: var(--text); font-size: 15px; line-height: 1.9; }
.mempty span { font-size: 13px; color: var(--text-soft); }

/* filter bottom sheet */
.msheet-ov {
  position: fixed; inset: 0; z-index: 210; background: rgba(0,0,0,.34);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.msheet-ov.show { opacity: 1; pointer-events: auto; }
.msheet {
  width: 100%; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
  box-shadow: var(--shadow-pop);
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.7,.2,1);
}
.msheet-ov.show .msheet { transform: none; }
.msheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--separator-strong); margin: 6px auto 12px; }
.msheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.msheet-head > span { font-size: 17px; font-weight: 700; color: var(--text-strong); }
.msheet-clear { border: none; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.msheet-sec { margin-top: 16px; }
.msheet-lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 10px; }
.msheet-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--separator-strong); background: var(--surface);
  border-radius: var(--radius-pill); padding: 7px 13px;
  font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.fchip b { font-weight: 700; }
.fchip .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.fchip.on { background: var(--c); border-color: var(--c); color: #fff; }
.fchip.on .dot { background: #fff; }
.fchip.rchip.on { background: var(--accent); border-color: var(--accent); }
.msheet-done {
  margin-top: 22px; width: 100%; height: 48px; border: none; border-radius: 13px;
  background: var(--accent); color: var(--on-accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
}

/* event detail modal becomes a bottom sheet on phones */
@media (max-width: 720px) {
  .ov { align-items: flex-end; padding: 0; backdrop-filter: blur(4px); }
  .modal {
    max-width: none; width: 100%;
    border-radius: 20px 20px 0 0; border-top-width: 4px;
    padding: 26px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(100%);
  }
  .ov.show .modal { transform: none; }
  .modal-grab { display: block; width: 38px; height: 5px; border-radius: 3px;
    background: var(--separator-strong); margin: 2px auto 10px; }
  .modal .x { top: 14px; }
  .modal h2 { font-size: 19px; }
}

/* ============================================================
   小幫手 Bot — 浮動鈕 + 聊天面板（沿用主題變數，深色自動套用）
   ============================================================ */
.bot-fab {
  /* 桌機靠右，與展開後停靠的對話框同一側；手機仍在左下（見下方 media query） */
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 195; width: 52px; height: 52px; border-radius: 50%; border: none;
  background: var(--accent); color: var(--on-accent); font-size: 24px; cursor: pointer;
  display: grid; place-items: center; box-shadow: var(--shadow-chip);
  transition: transform .14s ease, box-shadow .14s ease;
}
.bot-fab:hover { box-shadow: 0 8px 26px rgba(0,0,0,.22); }
.bot-fab:active { transform: scale(.94); }

.bot-ov {
  position: fixed; inset: 0; z-index: 190;
  background: rgba(0,0,0,.28); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.bot-ov.show { opacity: 1; pointer-events: auto; }

.bot-panel {
  position: fixed; left: 16px; bottom: 80px;
  width: 380px; max-width: calc(100vw - 32px); height: 560px; max-height: calc(100vh - 110px);
  background: var(--surface); border-radius: var(--radius-card);
  box-shadow: var(--shadow-pop); border: 1px solid var(--separator);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(10px) scale(.98); opacity: 0;
  transition: transform .2s cubic-bezier(.2,.7,.2,1), opacity .18s ease;
}
.bot-ov.show .bot-panel { transform: none; opacity: 1; }
.bot-grab { display: none; }

.bot-draghandle { flex: none; }
.bot-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--separator);
  background: var(--surface-2);
}
.bot-head-t { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.bot-h1 { font-size: 15px; font-weight: 700; color: var(--text-strong); }
/* 標題列右邊還要塞模式鈕，副標一律單行截字，面板高度才不會忽高忽低 */
.bot-h2 { font-size: 12px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bot-x, .bot-clear {
  width: 30px; height: 30px; border-radius: 50%; border: none; flex: none;
  background: var(--surface-hover); color: var(--text); line-height: 1;
  cursor: pointer; display: grid; place-items: center;
}
.bot-x { font-size: 19px; }
.bot-clear { font-size: 16px; }
.bot-x:hover, .bot-clear:hover { background: var(--separator-strong); }

.bot-log {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch; touch-action: pan-y;
}
.bot-msg { font-size: 14px; line-height: 1.5; max-width: 92%; }
.bot-msg.user {
  align-self: flex-end; background: var(--accent); color: var(--on-accent);
  padding: 8px 13px; border-radius: 15px 15px 4px 15px;
}
.bot-msg.bot {
  align-self: flex-start; background: var(--surface-hover); color: var(--text-strong);
  padding: 10px 13px; border-radius: 15px 15px 15px 4px; width: 100%; box-sizing: border-box;
}
.bot-intro { font-weight: 600; margin-bottom: 9px; color: var(--text-strong); }
.bot-cards { display: flex; flex-direction: column; gap: 8px; }

.bot-card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--separator);
  border-left: 3px solid var(--c, var(--accent)); border-radius: 10px;
  padding: 9px 11px; font: inherit; color: var(--text-strong);
  transition: background .12s ease, box-shadow .12s ease;
}
.bot-card:hover { background: var(--surface-hover); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.bc-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.bc-meta {
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;
  margin-top: 5px; font-size: 11.5px; color: var(--text-soft);
}
.bc-tk { display: inline-flex; align-items: center; gap: 5px; color: var(--c, var(--text)); font-weight: 600; }
.bc-tk .dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--c, var(--accent)); }
.bc-desc {
  margin-top: 6px; font-size: 12px; color: var(--text); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.bot-tracks { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.bot-track-chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--separator-strong); background: var(--surface);
  border-radius: var(--radius-pill); padding: 6px 11px; font: inherit; font-size: 12.5px;
  color: var(--text); transition: background .12s, border-color .12s, color .12s;
}
.bot-track-chip .dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--c, var(--accent)); }
.bot-track-chip:hover { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
.bot-track-chip:hover .dot { background: #fff; }

.bot-input-row {
  flex: none; display: flex; gap: 8px; padding: 12px 14px;
  border-top: 1px solid var(--separator); background: var(--surface-2);
}
.bot-input-row input {
  flex: 1; min-width: 0; height: 40px; border: 1px solid var(--separator-strong);
  background: var(--surface); border-radius: 11px; padding: 0 13px;
  font: inherit; font-size: 14px; color: var(--text-strong); outline: none;
}
.bot-input-row input::placeholder { color: var(--text-faint); }
.bot-input-row input:focus { border-color: var(--accent); }
.bot-send {
  flex: none; height: 40px; padding: 0 16px; border: none; border-radius: 11px;
  background: var(--accent); color: var(--on-accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.bot-send:active { transform: scale(.97); }

/* AI 模式：模式切換鈕、思考中、Agent 回覆裡的場次連結 */
.bot-mode {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: var(--radius-pill);
  border: 1px solid var(--separator-strong); background: var(--surface);
  font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-soft);
  cursor: pointer; white-space: nowrap;
}
.bot-mode .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
.bot-mode.on { border-color: var(--accent); color: var(--accent); }
.bot-mode.on .dot { background: var(--accent); }
.bot-mode:hover { background: var(--surface-hover); }

/* Agent 回的是純文字：一行一段，「- 」開頭的做成懸掛縮排的項目 */
.bot-p { margin: 0 0 7px; }
.bot-li { margin: 0 0 5px; padding-left: 14px; text-indent: -14px; }
.bot-p:last-child, .bot-li:last-child { margin-bottom: 0; }

.bot-sid {
  border: none; background: none; padding: 0; margin: 0; font: inherit;
  font-weight: 700; color: var(--accent); cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
.bot-sid:hover { opacity: .72; }

.bot-note { margin-top: 7px; font-size: 12.5px; color: var(--text-soft); line-height: 1.5; }
.bot-note code {
  font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--separator);
  border-radius: 5px; padding: 1px 5px;
}

.bot-typing { display: inline-flex; align-items: center; gap: 4px; height: 18px; }
.bot-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: bot-blink 1.1s infinite; }
.bot-typing i:nth-child(2) { animation-delay: .18s; }
.bot-typing i:nth-child(3) { animation-delay: .36s; }
@keyframes bot-blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

.bot-input-row input:disabled { opacity: .6; }
.bot-send:disabled { opacity: .55; cursor: progress; }

/* 手機：聊天面板改為底部抽屜 */
@media (max-width: 720px) {
  .bot-fab { left: 16px; right: auto; }
  .bot-ov { display: flex; align-items: flex-end; }
  .bot-panel {
    position: relative; left: auto; bottom: auto;
    width: 100%; max-width: none; height: auto; max-height: 86vh;
    border-radius: 20px 20px 0 0; border: none;
    transform: translateY(100%); opacity: 1;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bot-ov.show .bot-panel { transform: none; }
  /* iOS：輸入框字級需 ≥16px，聚焦時才不會自動放大、裁切畫面 */
  .bot-input-row input, .msearch input { font-size: 16px; }
  /* 拖曳區獨佔手勢；訊息區 .bot-log 維持原生捲動，互不干擾 */
  .bot-draghandle { touch-action: none; cursor: grab; }
  .bot-grab {
    display: block; width: 38px; height: 5px; border-radius: 3px;
    background: var(--separator-strong); margin: 8px auto 2px; flex: none;
  }
  .bot-fab { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
}

/* Team entry is enabled only by the self-host server, never static Pages. */
.team-entry, .team-entry-mobile { display: none; }
html[data-selfhost="true"] .team-entry { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 980px; color: var(--accent); background: var(--accent-soft); text-decoration: none; font: 600 13px var(--font); white-space: nowrap; }
html[data-selfhost="true"] .team-entry-mobile { display: block; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--separator); }
.team-entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ============================================================
   回放筆記（首頁）— 活動結束後的主要入口
   一張回放地圖是唯一的亮點；其餘介面只用紙色、墨色與髮絲線。
   紅筆（--pen）只用在回放內文的粗體重點。
   ============================================================ */
.ico { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* 共用頂列（回放與完整議程都用） */
.site-head {
  position: sticky; top: 0; z-index: 80;
  display: flex; align-items: center; gap: 24px;
  height: 64px; padding: 0 32px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(8px); -webkit-backdrop-filter: saturate(1.2) blur(8px);
  border-bottom: 1px solid var(--hairline);
}
.app > .site-head, .mapp > .site-head { position: relative; flex: 0 0 auto; }
.wordmark { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--text-strong); white-space: nowrap; }
.wordmark b { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: 0; }
.wordmark span { font-size: 14px; color: var(--text-soft); }
.site-nav { display: flex; gap: 4px; }
.site-nav a {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: var(--radius-ctl);
  font-size: 14px; color: var(--text); text-decoration: none; white-space: nowrap;
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.site-nav a:hover { background: var(--accent-soft); color: var(--text-strong); }
.site-nav a.on { background: var(--surface-hover); color: var(--text-strong); font-weight: 500; }
.site-nav a .n { font-family: var(--mono); font-size: 12px; color: var(--text-soft); margin-left: 6px; }
.site-tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.tool-btn {
  height: 32px; min-width: 32px; padding: 0 8px; border-radius: var(--radius-ctl);
  border: none; background: transparent; color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 13px; text-decoration: none; white-space: nowrap;
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.tool-btn:hover { background: var(--accent-soft); color: var(--text-strong); }
.tool-btn.on { background: var(--surface-hover); color: var(--text-strong); }
.tool-btn:focus-visible, .site-nav a:focus-visible, .rp button:focus-visible, .rp a:focus-visible,
.rp input:focus-visible, .rp select:focus-visible, .reader button:focus-visible, .reader a:focus-visible {
  outline: 2px solid var(--text-strong); outline-offset: 2px;
}
.tool-btn .lang { font-family: var(--mono); font-size: 12px; }

/* 頁面捲動容器 */
.rp { height: 100%; overflow-y: auto; background: var(--bg); color: var(--text-strong); }
.rp.locked { overflow: hidden; }
.rp-wrap { max-width: 1360px; margin: 0 auto; padding: 0 32px; }

/* ---------- hero：左文右地圖 ---------- */
.rp-hero {
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 64px; align-items: center;
  padding: 72px 0 80px;
  animation: rp-rise .5s var(--ease) both;
}
@keyframes rp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.rp-kicker { font-family: var(--mono); font-size: 12px; color: var(--text-soft); margin-bottom: 20px; }
.rp-kicker i { font-style: normal; color: var(--text-strong); }
.rp-h1 {
  font-family: var(--serif); font-weight: 600; font-size: 44px; line-height: 1.3;
  letter-spacing: 0; color: var(--text-strong); margin: 0 0 20px;
}
.rp-sub { font-size: 17px; line-height: 1.8; color: var(--text); max-width: 34em; margin: 0 0 32px; }
.rp-figs { display: flex; gap: 32px; margin: 0 0 40px; }
.rp-fig b { display: block; font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.rp-fig span { display: block; margin-top: 8px; font-size: 13px; color: var(--text-soft); }
.rp-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px;
  border-radius: var(--radius-ctl); font: inherit; font-size: 15px; font-weight: 500;
  text-decoration: none; cursor: pointer; border: 1px solid transparent;
  transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease);
}
.btn:active { transform: scale(.98); }
.btn-pri { background: var(--accent); color: var(--on-accent); }
.btn-pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--bg)); }
.btn-sec { background: var(--surface); color: var(--text-strong); border-color: var(--separator-strong); }
.btn-sec:hover { background: var(--surface-hover); }

/* ---------- 回放地圖：三天 × 四舞台，每場一條刻度 ---------- */
.rmap {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-card);
  padding: 24px; box-shadow: var(--shadow-pop);
}
.rmap-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.rmap-title { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.rmap-hint { font-size: 13px; color: var(--text-soft); }
.rmap-grid { display: grid; grid-template-columns: 112px repeat(var(--days), minmax(0, 1fr)); column-gap: 16px; }
.rmap-dh { font-size: 13px; color: var(--text); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.rmap-dh b { font-weight: 500; color: var(--text-strong); }
.rmap-dh span { font-family: var(--mono); font-size: 12px; color: var(--text-soft); }
.rmap-sl { font-size: 13px; color: var(--text); display: flex; align-items: center; height: 44px; white-space: nowrap; }
.rmap-cell { position: relative; height: 44px; border-top: 1px solid var(--hairline); }
.rmap-cell::before { /* 午間 12:00 的淡格線 */
  content: ""; position: absolute; top: 0; bottom: 0; left: var(--noon); width: 1px; background: var(--hairline);
}
.rtick {
  position: absolute; top: 10px; height: 24px; min-width: 3px; padding: 0; border: none; cursor: pointer;
  border-radius: 2px; background: var(--text-strong); opacity: .78;
  transition: opacity .15s var(--ease), background-color .15s var(--ease), transform .15s var(--ease);
}
.rtick::after { content: ""; position: absolute; inset: -10px -1px; } /* 擴大可點範圍 */
.rtick.dim { opacity: .12; }
.rtick:hover, .rtick.hot { background: var(--pen); opacity: 1; transform: scaleY(1.25); }
.rmap-axis { position: relative; height: 20px; border-top: 1px solid var(--hairline); }
.rmap-axis span { position: absolute; top: 6px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
.rmap-axis span:first-child { transform: none; }
.rmap-axis span:last-child { transform: translateX(-100%); }
.rmap-cap {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hairline);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; min-height: 64px; align-items: baseline;
}
.rmap-cap .t { font-family: var(--mono); font-size: 12px; color: var(--text-soft); white-space: nowrap; }
.rmap-cap .n { font-size: 14px; font-weight: 500; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rmap-cap .l { grid-column: 2; font-size: 13px; color: var(--text); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.rmap-cap .idle { grid-column: 1 / -1; font-size: 13px; color: var(--text-soft); }

/* ---------- 篩選側欄＋清單 ---------- */
.rp-body { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 48px; padding: 0 0 96px; border-top: 1px solid var(--hairline); }
.rp-side { position: sticky; top: 64px; align-self: start; padding: 32px 0; max-height: calc(100vh - 64px); overflow-y: auto; }
.rp-search { position: relative; margin-bottom: 24px; }
.rp-search .ico { position: absolute; left: 12px; top: 12px; color: var(--text-soft); }
.rp-search input {
  width: 100%; height: 40px; padding: 0 36px 0 36px; border-radius: var(--radius-ctl);
  border: 1px solid var(--separator-strong); background: var(--surface); color: var(--text-strong);
  font: inherit; font-size: 14px; outline: none; transition: border-color .15s var(--ease);
}
.rp-search input::placeholder { color: var(--text-soft); }
.rp-search input:focus { border-color: var(--text-soft); }
.rp-search .clr { position: absolute; right: 4px; top: 4px; height: 32px; width: 32px; border: none; background: transparent;
  color: var(--text-soft); cursor: pointer; border-radius: 6px; display: grid; place-items: center; }
.rp-search .clr:hover { color: var(--text-strong); background: var(--accent-soft); }
.fgroup + .fgroup { margin-top: 24px; }
.fgroup-h { font-size: 12px; color: var(--text-soft); margin: 0 0 8px 8px; }
.fopt {
  width: 100%; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  border: none; background: transparent; border-radius: var(--radius-ctl); cursor: pointer;
  font: inherit; font-size: 14px; color: var(--text); text-align: left;
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.fopt + .fopt { margin-top: 2px; }
.fopt:hover { background: var(--accent-soft); color: var(--text-strong); }
.fopt.on { background: var(--surface-hover); color: var(--text-strong); font-weight: 500; box-shadow: inset 0 0 0 1px var(--hairline); }
.fopt .c { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--text-soft); }
.fopt.zero { opacity: .45; }
.rp-reset { margin: 24px 0 0 8px; border: none; background: none; padding: 0; font: inherit; font-size: 13px;
  color: var(--text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.rp-reset:hover { color: var(--text-strong); }

.rp-main { padding: 32px 0 0; min-width: 0; }
.rp-count { font-size: 13px; color: var(--text-soft); margin-bottom: 8px; }
.rp-count b { font-family: var(--mono); font-weight: 500; color: var(--text-strong); }
.dgroup + .dgroup { margin-top: 48px; }
.dgroup-h { display: flex; align-items: baseline; gap: 12px; padding: 16px 0 12px; border-bottom: 1px solid var(--separator-strong); }
.dgroup-h h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.3; }
.dgroup-h span { font-family: var(--mono); font-size: 12px; color: var(--text-soft); }

.ritem {
  display: grid; grid-template-columns: 88px minmax(0, 1fr) 24px; gap: 24px; align-items: start;
  width: 100%; padding: 24px 16px; margin: 0 -16px; width: calc(100% + 32px);
  border: none; border-bottom: 1px solid var(--hairline); background: transparent;
  border-radius: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
  transition: background-color .15s var(--ease);
}
.ritem:hover { background: var(--surface); }
.ritem:hover .go { color: var(--text-strong); transform: translateX(2px); }
.ritem .when { font-family: var(--mono); font-size: 13px; color: var(--text-strong); line-height: 24px; }
.ritem .when small { display: block; font-size: 12px; color: var(--text-soft); line-height: 16px; }
.ritem .meta { font-size: 13px; color: var(--text-soft); margin-bottom: 4px; }
.ritem .ttl { font-size: 18px; font-weight: 500; line-height: 1.45; color: var(--text-strong); margin-bottom: 8px; text-wrap: pretty; }
.ritem .lead { font-size: 15px; line-height: 1.85; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ritem .lead p { display: inline; }
.ritem .spk { margin-top: 8px; font-size: 13px; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .go { color: var(--text-faint); margin-top: 28px; transition: color .15s var(--ease), transform .15s var(--ease); }
.ritem .go .ico { width: 18px; height: 18px; }

/* 紅筆劃線：回放內文的 **粗體** 就是講者的重點句 */
.pen strong { font-weight: 500; color: var(--text-strong);
  text-decoration: underline; text-decoration-color: var(--pen); text-decoration-thickness: 1.5px;
  text-underline-offset: .32em; text-decoration-skip-ink: none; }

.rp-empty { padding: 64px 0; color: var(--text-soft); font-size: 15px; }
.rp-empty button { margin-top: 16px; }
.rp-foot { border-top: 1px solid var(--hairline); padding: 32px 0 48px; font-size: 13px; line-height: 1.8; color: var(--text-soft); }
.rp-foot a { color: var(--text); }

/* ---------- 閱讀面板 ---------- */
.reader-ov { position: fixed; inset: 0; z-index: 300; background: rgba(20, 17, 13, .32);
  animation: rd-fade .22s var(--ease) both; }
[data-theme="dark"] .reader-ov { background: rgba(0, 0, 0, .55); }
@keyframes rd-fade { from { opacity: 0; } to { opacity: 1; } }
.reader {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 301;
  width: min(760px, 100vw); display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--hairline); box-shadow: var(--shadow-pop);
  animation: rd-in .36s var(--ease) both;
}
@keyframes rd-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.reader-bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 16px;
  border-bottom: 1px solid var(--hairline);
}
.reader-bar .pos { font-family: var(--mono); font-size: 12px; color: var(--text-soft); margin: 0 8px; }
.reader-bar .sp { flex: 1; }
.reader-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.reader-doc { padding: 40px 48px 64px; max-width: 680px; }
.reader-doc .meta { font-family: var(--mono); font-size: 12px; color: var(--text-soft); line-height: 1.8; }
.reader-doc .meta i { font-style: normal; color: var(--text); }
.reader-doc h1 { font-size: 26px; font-weight: 500; line-height: 1.4; margin: 12px 0 12px; text-wrap: pretty; }
.reader-doc .spk { font-size: 14px; line-height: 1.7; color: var(--text); margin-bottom: 32px; }
.reader-doc .lead {
  font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.9; color: var(--text-strong);
  padding: 4px 0 4px 20px; border-left: 2px solid var(--text-strong); margin: 0 0 40px;
}
.reader-doc .lead p + p { margin-top: 8px; }
.reader-doc .lead strong { font-weight: 600; }
.reader-doc .lab { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
.rbody { font-size: 16px; line-height: 1.9; color: var(--text-strong); }
.rbody h4 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 40px 0 12px; }
.rbody h4:first-child { margin-top: 0; }
.rbody p { margin: 0 0 12px; }
.rbody ol, .rbody ul { margin: 0 0 16px; padding-left: 24px; }
.rbody ol { list-style: none; counter-reset: rb; padding-left: 36px; }
.rbody ol > li { counter-increment: rb; position: relative; }
.rbody ol > li::before { content: counter(rb, decimal-leading-zero); position: absolute; left: -36px; top: 4px;
  font-family: var(--mono); font-size: 12px; line-height: 24px; color: var(--text-soft); }
.rbody li { margin-bottom: 12px; }
.rbody li::marker { color: var(--text-soft); }
.rbody li ul { margin: 8px 0 0; }
.rbody li ul li { margin-bottom: 4px; font-size: 15px; color: var(--text); }
.rbody table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.7; margin: 8px 0 20px; display: block; overflow-x: auto; }
.rbody th, .rbody td { border-bottom: 1px solid var(--hairline); padding: 8px 12px 8px 0; text-align: left; vertical-align: top; }
.rbody th { font-weight: 500; color: var(--text-soft); font-size: 13px; }
.reader-note { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--hairline); font-size: 13px; line-height: 1.8; color: var(--text-soft); }
.reader-note a { color: var(--text); }
.reader-next { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.reader-next button {
  border: 1px solid var(--hairline); background: var(--bg); border-radius: 12px; padding: 16px;
  text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0;
  transition: background-color .15s var(--ease), border-color .15s var(--ease);
}
.reader-next button:hover { background: var(--surface-hover); border-color: var(--separator-strong); }
.reader-next button:disabled { visibility: hidden; }
.reader-next .k { font-size: 12px; color: var(--text-soft); display: block; margin-bottom: 4px; }
.reader-next .v { font-size: 14px; font-weight: 500; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reader-next .nx { text-align: right; }
.toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 400;
  background: var(--accent); color: var(--on-accent); font-size: 13px; padding: 8px 16px; border-radius: var(--radius-ctl);
  animation: rd-fade .18s var(--ease) both; }

/* 議程分頁裡舊元件的小修：有回放的場次標記改成安靜的文字 */
.rtag { font-size: 11px !important; font-weight: 500 !important; color: var(--text) !important;
  background: var(--surface-hover) !important; border: none !important; border-radius: 4px !important; }
.agenda-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.modal .go-read { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; font-weight: 500;
  color: var(--text-strong); text-decoration: underline; text-decoration-color: var(--pen); text-underline-offset: 4px; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }

/* ---------- 窄螢幕 ---------- */
@media (max-width: 1080px) {
  .rp-hero { grid-template-columns: minmax(0, 1fr); gap: 48px; padding: 56px 0 64px; }
  .rp-body { grid-template-columns: 216px minmax(0, 1fr); gap: 32px; }
}
@media (max-width: 720px) {
  .site-head { height: 56px; padding: 0 16px; gap: 12px; }
  .wordmark span { display: none; }
  .site-nav a { padding: 0 10px; font-size: 14px; }
  .site-nav a .n { display: none; }
  .site-tools .ext-link { display: none; }
  .rp-wrap { padding: 0 16px; }
  .rp-hero { padding: 40px 0 48px; gap: 40px; }
  .rp-kicker { margin-bottom: 16px; }
  .rp-h1 { font-size: 30px; line-height: 1.35; }
  .rp-sub { font-size: 16px; margin-bottom: 28px; }
  .rp-figs { gap: 28px; margin-bottom: 32px; }
  .rp-fig b { font-size: 28px; }
  .rp-actions .btn { flex: 1 1 auto; justify-content: center; }
  .rmap { padding: 16px; margin: 0 -4px; }
  .rmap-head { flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .rmap-grid { grid-template-columns: 84px minmax(0, 1fr); }
  .rmap-grid .rmap-dh { grid-column: 1 / -1; padding: 16px 0 4px; }
  .rmap-grid .rmap-dh:first-child { padding-top: 0; }
  .rmap-sl, .rmap-cell { height: 32px; }
  .rmap-sl { font-size: 12px; }
  .rtick { top: 7px; height: 18px; }
  .rmap-cap { min-height: 72px; }

  .rp-body { display: block; border-top: none; }
  .rp-side { position: sticky; top: 56px; z-index: 40; max-height: none; overflow: visible; padding: 12px 16px;
    margin: 0 -16px; background: var(--bg); border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  .rp-search { margin-bottom: 8px; }
  .fgroup-h { display: none; }
  .fgroup { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .fgroup::-webkit-scrollbar { display: none; }
  .fgroup + .fgroup { margin-top: 8px; }
  .fopt { width: auto; flex: 0 0 auto; height: 32px; padding: 0 12px; border: 1px solid var(--separator); }
  .fopt + .fopt { margin-top: 0; }
  .fopt.on { border-color: var(--text-strong); box-shadow: none; }
  .fopt .c { margin-left: 4px; }
  .fgroup.topic { display: none; }
  .rp-reset { display: none; }
  .rp-main { padding-top: 16px; }
  .ritem { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 20px 16px; }
  .ritem .when { line-height: 16px; display: flex; gap: 8px; align-items: baseline; }
  .ritem .when small { display: inline; }
  .ritem .go { display: none; }
  .ritem .ttl { font-size: 17px; }
  .dgroup-h h2 { font-size: 21px; }

  .reader { width: 100vw; border-left: none; }
  .reader-bar { padding: 0 8px; }
  .reader-doc { padding: 24px 20px 48px; }
  .reader-doc h1 { font-size: 22px; }
  .reader-doc .lead { font-size: 18px; padding-left: 16px; margin-bottom: 32px; }
  .rbody { font-size: 16px; }
  .reader-next { grid-template-columns: 1fr; }
  .reader-next .nx { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .rp-hero, .reader, .reader-ov, .toast { animation: none; }
}
</style>
